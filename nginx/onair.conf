# =============================================
# GMO ONAiR Platform — Nginx リバースプロキシ
# 3アプリ並走: ONAiR + Qsheet + EventStamp
# =============================================

# --- アップストリーム定義 ---
upstream onair {
    server localhost:3000;
}

upstream qsheet {
    server localhost:3456;
}

upstream eventstamp {
    server localhost:3001;
}

# --- レート制限 (EventStampスタンプAPI用) ---
limit_req_zone $binary_remote_addr zone=stamps:10m rate=20r/s;

server {
    listen 80;
    server_name _;  # ← 実際のドメインに変更 (例: onair.gmo-studio.com)

    # クライアント最大ボディサイズ
    client_max_body_size 50M;

    # =====================
    # ONAiR (メインアプリ)
    # =====================
    location / {
        proxy_pass http://onair;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # =====================
    # Qsheet Editor (キューシート)
    # =====================
    location /qsheet/ {
        proxy_pass http://qsheet/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /qsheet;
    }

    # =====================
    # EventStamp (インタラクティブ演出)
    # =====================
    location /interactive/ {
        proxy_pass http://eventstamp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /interactive;
    }

    # EventStamp Socket.IO (WebSocketアップグレード)
    location /interactive/socket.io/ {
        proxy_pass http://eventstamp/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # EventStamp スタンプAPI レート制限
    location /interactive/api/ {
        limit_req zone=stamps burst=30 nodelay;
        proxy_pass http://eventstamp/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================
    # 共通設定
    # =====================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # セキュリティヘッダー
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
}
