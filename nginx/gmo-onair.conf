# =============================================
# GMO ONAiR — Nginx リバースプロキシ + SSL
# 本番: gmo-onair.jp → app-prod:3000
# 開発: dev.gmo-onair.jp → app-dev:3000
# =============================================

# レート制限
#
# ⚠️ **`limit_req_status` を明示している。** 既定は 503 で、これは**上流が落ちた／詰まった
# ときの 503 と同じ番号**になる。画面側 (`ErrorPanel`) は 5xx をひとまとめに
# 「サーバー側で処理が止まりました」と出すので、**混み合っているのかアプリが壊れたのかを
# 利用者も開発者も区別できなかった**。429 なら別の文言を出せる（`humanizeError()`）。
#
# ⚠️ **オフィスの NAT では全社員が1つのグローバル IP を共有する**ので、このバケットは
# 全員で取り合う。数字を変える前に `access.log` で 429 が実際に出ているかを見ること
# （現状ここに当たっている証拠は無い。当たっていないのに緩めても意味がない）。
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

# =============================================
# 共通プロキシ設定 (マクロ的に使用)
# =============================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# =============================================
# HTTP → HTTPS リダイレクト
# =============================================
server {
    listen 80;
    server_name gmo-onair.jp www.gmo-onair.jp dev.gmo-onair.jp;

    # Let's Encrypt ACME チャレンジ
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================
# 本番: gmo-onair.jp
# =============================================
server {
    listen 443 ssl;
    http2 on;
    server_name gmo-onair.jp www.gmo-onair.jp;

    # SSL証明書 (certbot が自動設定)
    ssl_certificate /etc/letsencrypt/live/gmo-onair.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gmo-onair.jp/privkey.pem;

    # SSL設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 検索エンジンによるインデックス拒否 (全レスポンス対象・静的資産/API含む)
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    # robots.txt (nginx で直接応答)
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    client_max_body_size 50M;

    # Docker内部DNS (コンテナIP変更時に自動再解決)
    resolver 127.0.0.11 valid=10s;
    set $upstream_prod http://app_prod:3000;

    # API
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass $upstream_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ⚠️ **書かないと既定の 60 秒**で、超えると 504 になる（それが起きていた）。
        # アプリ側の `statement_timeout` は 60 秒 (`server/src/shared/db/connection.ts`) なので、
        # **ここを 65 秒にして、アプリが自分で「時間切れ」を返しきれる余地を残す**。
        # 先に nginx が切ると、素の 504 になって**何が遅かったのか誰にも分からない**。
        # ⚠️ **これは「60 秒まで待ってよい」という意味ではない。** 60 秒を超える処理は
        # リクエストの中で待たず、先に 202 を返して画面が様子を見に来る形にすること
        # （`client/CLAUDE.md`「文字起こし・整形はリクエストの中で待たない」）。
        proxy_connect_timeout 5s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass $upstream_prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Health check
    location /health {
        proxy_pass $upstream_prod;
        proxy_set_header Host $host;
    }

    # 全ルート → Express
    location / {
        proxy_pass $upstream_prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # セキュリティヘッダー
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# =============================================
# 開発: dev.gmo-onair.jp
# =============================================
server {
    listen 443 ssl;
    http2 on;
    server_name dev.gmo-onair.jp;

    ssl_certificate /etc/letsencrypt/live/gmo-onair.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gmo-onair.jp/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # 開発環境バナー
    add_header X-Environment "development" always;

    # 検索エンジンによるインデックス拒否
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    # robots.txt (nginx で直接応答 — クローラ拒否)
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Docker内部DNS
    resolver 127.0.0.11 valid=10s;
    set $upstream_dev http://app_dev:3000;

    # v2.5.0: Basic 認証は廃止。
    # dev もアプリレイヤーで email/password 認証 (本番と同じフロー) を行う。
    # 検索エンジン除けは X-Robots-Tag + robots.txt + noindex meta で対応。

    # API
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass $upstream_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ⚠️ **書かないと既定の 60 秒**で、超えると 504 になる（それが起きていた）。
        # アプリ側の `statement_timeout` は 60 秒 (`server/src/shared/db/connection.ts`) なので、
        # **ここを 65 秒にして、アプリが自分で「時間切れ」を返しきれる余地を残す**。
        # 先に nginx が切ると、素の 504 になって**何が遅かったのか誰にも分からない**。
        # ⚠️ **これは「60 秒まで待ってよい」という意味ではない。** 60 秒を超える処理は
        # リクエストの中で待たず、先に 202 を返して画面が様子を見に来る形にすること
        # （`client/CLAUDE.md`「文字起こし・整形はリクエストの中で待たない」）。
        proxy_connect_timeout 5s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass $upstream_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /health {
        proxy_pass $upstream_dev;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass $upstream_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;
}
