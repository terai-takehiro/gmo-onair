# =============================================
# GMO ONAiR — Nginx リバースプロキシ + SSL
# 本番: gmo-onair.jp → app-prod:3000
# 開発: dev.gmo-onair.jp → app-dev:3000
# =============================================

# レート制限
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# =============================================
# 共通プロキシ設定 (マクロ的に使用)
# =============================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# =============================================
# HTTP → HTTPS リダイレクト
# =============================================
server {
    listen 80;
    server_name gmo-onair.jp www.gmo-onair.jp dev.gmo-onair.jp;

    # Let's Encrypt ACME チャレンジ
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================
# 本番: gmo-onair.jp
# =============================================
server {
    listen 443 ssl;
    http2 on;
    server_name gmo-onair.jp www.gmo-onair.jp;

    # SSL証明書 (certbot が自動設定)
    ssl_certificate /etc/letsencrypt/live/gmo-onair.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gmo-onair.jp/privkey.pem;

    # SSL設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50M;

    # Docker内部DNS (コンテナIP変更時に自動再解決)
    resolver 127.0.0.11 valid=10s;
    set $upstream_prod http://app-prod:3000;

    # API
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass $upstream_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass $upstream_prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Health check
    location /health {
        proxy_pass $upstream_prod;
        proxy_set_header Host $host;
    }

    # 全ルート → Express
    location / {
        proxy_pass $upstream_prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # セキュリティヘッダー
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# =============================================
# 開発: dev.gmo-onair.jp
# =============================================
server {
    listen 443 ssl;
    http2 on;
    server_name dev.gmo-onair.jp;

    ssl_certificate /etc/letsencrypt/live/gmo-onair.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gmo-onair.jp/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # 開発環境バナー
    add_header X-Environment "development" always;

    # Docker内部DNS
    resolver 127.0.0.11 valid=10s;
    set $upstream_dev http://app-dev:3000;

    # ベーシック認証 (開発環境保護)
    auth_basic "GMO ONAiR Dev";
    auth_basic_user_file /etc/nginx/dev-htpasswd;

    # API
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass $upstream_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass $upstream_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /health {
        proxy_pass $upstream_dev;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass $upstream_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;
}
