<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700;800&display=swap">
  <style>
    html, body { height: 100%; }
    /* 描画側の受け皿（#dc-root など）に高さが無いと height:100% が解決できない */
    body > div { height: 100%; }
    body { margin: 0; background: #f2f4f7;
      font-family: 'LINE Seed JP', 'Noto Sans JP', -apple-system, 'Hiragino Sans', 'BIZ UDPGothic', Meiryo, sans-serif;
      font-feature-settings: 'palt' 1, 'kern' 1; color: #1a1d24; -webkit-font-smoothing: antialiased; }
    a { color: #c2410e; text-decoration: none; } a:hover { color: #9a3412; }
    .num { font-variant-numeric: tabular-nums; }
    .tap { transition: background-color .16s, transform .14s; }
    .tap:active { transform: scale(.985); }
    .tap:hover { background: #fbfcfd; }
    /* 長体。**枠を 1/縮小率 だけ広げてから縮める** — こうしないと ellipsis が
       変形前の幅で決まるので、字が細くなるだけで文字数は増えない。
       JS で測って書き戻す「長体フィット」は入れない（DESIGN_POLICY.md）*/
    .condw { flex: 1 1 0; min-width: 0; overflow: hidden; }   /* 横並びの中で使う受け皿 */
    .condb { display: block; min-width: 0; overflow: hidden; } /* 縦積みの中で使う受け皿 */
    .cond { display: block; width: 106.4%; transform: scaleX(.94); transform-origin: left center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cond-s { display: block; width: 111.2%; transform: scaleX(.90); transform-origin: left center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cond-r { display: block; width: 106.4%; margin-left: -6.4%; transform: scaleX(.94);
      transform-origin: right center; text-align: right;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nb { white-space: nowrap; }
    .ico { display: block; }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; height: 100vh; background: #f2f4f7; overflow: hidden">

  <!-- ナビゲーションバー（OS の時計・電池は描かない） -->
  <div style="flex-shrink: 0; background: #fff; border-bottom: 1px solid #e6e9ed">
    <div style="display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 8px">
      <span style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
        <svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ accent }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
      </span>
      <span class="nb" style="flex: 1; min-width: 0; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: .01em; overflow: hidden; text-overflow: ellipsis">収録設定</span>
      <span style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ accent }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      </span>
    </div>
    <div style="padding: 0 16px 9px; display: flex; align-items: center; gap: 8px">
      <span class="num nb" style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 7px; background: #fff7ed; color: #c2410e; font-size: 11px; font-weight: 800; flex-shrink: 0">GLS002-003</span>
      <span class="condw"><span class="cond" style="font-size: 12.5px; color: #5d6470">60周年 記念式典 ／ 8/24（月）・用賀</span></span>
    </div>
  </div>

  <!-- 本文 -->
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 11px">

    <!-- 状態の要約（いま見えている台ぶん） -->
    <div style="display: flex; gap: 8px; flex-shrink: 0">
      <sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; padding: 9px 10px; background: #fff; border-radius: 14px; overflow: hidden">
          <span class="cond" style="font-size: 11px; font-weight: 800; color: #9aa1ab">{{ s.label }}</span>
          <span style="display: flex; align-items: baseline; gap: 3px">
            <span class="num" style="font-size: 19px; font-weight: 800; color: {{ s.fg }}; line-height: 1.15">{{ s.value }}</span>
            <span class="nb" style="font-size: 11px; color: #9aa1ab">台</span>
          </span>
        </span>
      </sc-for>
    </div>

    <!-- 切替（タップ 44px） -->
    <span style="display: flex; background: #e2e5ea; border-radius: 12px; padding: 3px; gap: 3px; flex-shrink: 0">
      <sc-for list="{{ scopes }}" as="sc" hint-placeholder-count="2">
        <span onClick="{{ sc.pick }}" class="tap nb" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; height: 44px; border-radius: 9px; background: {{ sc.bg }}; color: {{ sc.fg }}; font-size: 13px; font-weight: {{ sc.weight }}; box-shadow: {{ sc.shadow }}; cursor: pointer">{{ sc.label }}</span>
      </sc-for>
    </span>

    <!-- 見出し -->
    <span style="display: flex; align-items: baseline; gap: 8px; padding: 0 4px; flex-shrink: 0">
      <span class="condw"><span class="cond" style="font-size: 11.5px; font-weight: 800; color: #9aa1ab">{{ listTitle }}</span></span>
      <span class="num nb" style="font-size: 11.5px; font-weight: 800; color: #9aa1ab; flex-shrink: 0">{{ listCount }}</span>
    </span>

    <!-- 一覧（ここだけスクロールする） -->
    <div style="flex: 1; min-height: 0; overflow-y: auto; background: #fff; border-radius: 14px">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
        <div onClick="{{ r.open }}" class="tap" style="display: flex; align-items: center; gap: 9px; min-height: 60px; padding: 9px 12px 9px 14px; cursor: pointer; border-top: {{ r.rule }}">
          <span style="width: 6px; height: 6px; border-radius: 999px; background: {{ r.dot }}; flex-shrink: 0"></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; overflow: hidden">
            <span style="display: flex; align-items: baseline; gap: 7px">
              <span class="num nb" style="font-size: 13.5px; font-weight: 800; letter-spacing: .03em; flex-shrink: 0">{{ r.id }}</span>
              <span class="condw"><span class="cond" style="font-size: 13px; font-weight: 700; color: #3c424c">{{ r.label }}</span></span>
            </span>
            <span class="num cond-s" style="font-size: 11.5px; color: {{ r.metaFg }}">{{ r.meta }}</span>
          </span>
          <span style="flex-shrink: 0">
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#cbd2da" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg>
          </span>
        </div>
      </sc-for>
    </div>

    <span class="cond" style="padding: 0 4px 2px; font-size: 11.5px; color: #5d6470; flex-shrink: 0">1 台ずつ開いて直します。まとめて変えるのは PC で。</span>
  </div>

  <!-- 下端の主アクション -->
  <div style="flex-shrink: 0; padding: 9px 16px 20px; background: #f2f4f7">
    <button onClick="{{ noop }}" class="tap" style="width: 100%; height: 52px; border: none; border-radius: 14px; background: {{ accent }}; color: #fff; font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap">
      <svg class="ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M4 19h16"/></svg>
      Excel を書き出す
    </button>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844},"accent":{"editor":"color","default":"#c2410e","options":["#c2410e","#005bac","#197a4b","#4338ca"],"section":"見た目"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { scope: 'main' };
  }

  renderVals() {
    const accent = this.props.accent ?? '#c2410e';
    const scope = this.state.scope;

    // Main.dc.html と同じ 12 台。state はここでも同じ値を持つ（画面ごとに数え直さない）
    const MAIN = [
      { id: 'REC1', label: '本線 PGM', fmt: '1920x1080p59.94', codec: 'ProRes:HQ', audio: '2 ch', slot: 'ネットワーク', name: 'GLS002-003_PGM', state: '準備完了' },
      { id: 'REC2', label: 'サブ 1（引き）', fmt: '1920x1080p59.94', codec: 'ProRes:HQ', audio: '2 ch', slot: 'ネットワーク', name: 'GLS002-003_SUB1', state: '準備完了' },
      { id: 'REC3', label: 'サブ 2（寄り）', fmt: '1920x1080p59.94', codec: 'ProRes:HQ', audio: '2 ch', slot: 'NAS 未マウント', name: 'GLS002-003_SUB2', state: '注意' },
      { id: 'REC4', label: '客席', fmt: '1920x1080p59.94', codec: 'ProRes:HQ', audio: '2 ch', slot: 'ネットワーク', name: 'GLS002-003_HALL', state: '準備完了' },
      { id: 'REC5', label: 'ステージ 上手', fmt: '1920x1080p59.94', codec: 'ProRes:422', audio: '2 ch', slot: 'SSD 1', name: 'GLS002-003_STG_L', state: '準備完了' },
      { id: 'REC6', label: 'ステージ 下手', fmt: '1920x1080p59.94', codec: 'ProRes:422', audio: '2 ch', slot: 'SSD 1', name: 'GLS002-003_STG_R', state: '準備完了' },
      { id: 'REC7', label: '記録（4K 引き）', fmt: '3840x2160p59.94', codec: 'H.265:High', audio: '4 ch', slot: 'SSD 2', name: 'GLS002-003_4K', state: '準備完了' },
      { id: 'REC8', label: '予備 ISO', fmt: '', codec: '', audio: '2 ch', slot: 'ネットワーク', name: '', state: '未入力' },
    ];
    const BACKUP = [
      { id: 'REC1-P', label: '本線 PGM の控え', fmt: '1920x1080p59.94', codec: 'ProRes:422', audio: '2 ch', slot: 'SD 1', name: 'GLS002-003_PGM_BK', state: '準備完了' },
      { id: 'REC2-P', label: 'サブ 1 の控え', fmt: '1920x1080p59.94', codec: 'ProRes:422', audio: '2 ch', slot: 'SD 1', name: 'GLS002-003_SUB1_BK', state: '準備完了' },
      { id: 'REC3-P', label: 'サブ 2 の控え', fmt: '1920x1080p59.94', codec: 'ProRes:422', audio: '2 ch', slot: 'SD 2', name: '', state: '未入力' },
      { id: 'REC4-P', label: '客席の控え', fmt: '1920x1080p59.94', codec: 'ProRes:422', audio: '2 ch', slot: 'SD 2', name: 'GLS002-003_HALL_BK', state: '準備完了' },
    ];

    const src = scope === 'main' ? MAIN : BACKUP;

    const rows = src.map((d, i) => {
      // 足りない項目を名指しする（「未入力」とだけ出しても、何を入れるのか分からない）
      const missing = [];
      if (!d.fmt) missing.push('解像度');
      if (!d.codec) missing.push('コーデック');
      if (!d.name) missing.push('ファイル名');
      const warn = d.state === '注意';
      // 区切りは詰めの「・」（前後に空白を入れると 390px で末尾が切れる）
      const meta = missing.length > 0
        ? missing.join('・') + ' がまだです'
        : d.fmt + '・' + d.codec + '・' + d.audio + '・' + d.slot;
      return {
        id: d.id,
        label: d.label,
        open: () => {},
        rule: i === 0 ? 'none' : '1px solid #f2f4f7',
        dot: missing.length > 0 ? '#cbd2da' : (warn ? '#c2410e' : '#197a4b'),
        meta,
        metaFg: missing.length > 0 ? '#9aa1ab' : (warn ? '#c2410e' : '#5d6470'),
      };
    });

    const scopes = [
      { key: 'main', label: '本線 8 台' },
      { key: 'backup', label: '控え 4 台' },
    ].map((s) => ({
      label: s.label,
      pick: () => this.setState({ scope: s.key }),
      bg: scope === s.key ? '#fff' : 'transparent',
      fg: scope === s.key ? '#1a1d24' : '#5d6470',
      weight: scope === s.key ? '800' : '700',
      shadow: scope === s.key ? '0 1px 3px rgba(16,24,40,.14)' : 'none',
    }));

    // 帯の数字は、いま見えている台から数える（絞り込みとずれない）
    const count = (fn) => String(src.filter(fn).length);

    return {
      accent,
      noop: () => {},
      stats: [
        { label: '準備完了', value: count((d) => d.state === '準備完了'), fg: '#197a4b' },
        { label: '未入力', value: count((d) => d.state === '未入力'), fg: '#5d6470' },
        { label: '注意', value: count((d) => d.state === '注意'), fg: '#c2410e' },
      ],
      scopes,
      listTitle: scope === 'main' ? 'HyperDeck Studio 4K Pro' : 'HyperDeck HD Plus（本線と同じ入力）',
      listCount: src.length + ' 台',
      rows,
    };
  }
}
</script>
</body>
</html>
