<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:248px; box-sizing:border-box; flex-shrink:0; background:#fff; border-right:1px solid #e9ecf0; padding:14px 12px 20px">
  <sc-for list="{{ items }}" as="m" hint-placeholder-count="8">
    <div>
      <sc-if value="{{ m.group }}" hint-placeholder-val="{{ true }}">
        <p style="margin:14px 0 5px; padding:0 10px; font-size:11.5px; font-weight:800; color:#9aa1ab; letter-spacing:.1em; line-height:1.5">{{ m.group }}</p>
      </sc-if>
      <div onClick="{{ m.go }}" style="display:flex; align-items:center; gap:10px; min-height:38px; padding:6px 10px; border-radius:10px; cursor:pointer; background:{{ m.bg }}; color:{{ m.fg }}" style-hover="background:#f2f4f7">
        <span style="width:6px; height:6px; border-radius:999px; background:{{ m.dot }}; flex-shrink:0"></span>
        <span style="flex:1; min-width:0; font-size:13px; font-weight:{{ m.weight }}; line-height:1.5">{{ m.label }}</span>
        <sc-if value="{{ m.tag }}" hint-placeholder-val="{{ true }}">
          <span style="display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; height:19px; padding:0 6px; border-radius:5px; background:#f2f4f7; color:#5d6470; font-size:10.5px; font-weight:700; white-space:nowrap; flex-shrink:0">{{ m.tag }}</span>
        </sc-if>
      </div>
    </div>
  </sc-for>
  <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:18px; padding:11px 12px; border:1px dashed #e0e4e9; border-radius:11px">
      <p style="margin:0; font-size:12px; color:#5d6470; line-height:1.65">{{ note }}</p>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:520},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    return { items: p.items || [], note: p.note || '', hasNote: !!p.note };
  }
}
</script>
</body>
</html>
