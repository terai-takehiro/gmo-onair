<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body {
    margin: 0;
    background: #f7f8fa;
    color: #1a1d24;
    font-family: 'LINE Seed JP', 'Noto Sans JP', -apple-system, 'Hiragino Sans', 'BIZ UDPGothic', 'Meiryo', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: #005bac; text-decoration: none; }
  a:hover { color: #004a8d; text-decoration: underline; }
  .t-h1   { font-size: 20px;   line-height: 1.3;  font-weight: 800; }
  .t-ct   { font-size: 14.5px; line-height: 1.4;  font-weight: 800; }
  .t-list { font-size: 13.5px; line-height: 1.5;  font-weight: 700; }
  .t-sub  { font-size: 13px;   line-height: 1.55; font-weight: 400; }
  .t-ssm  { font-size: 11.5px; line-height: 1.6;  font-weight: 400; }
  .t-bdg  { font-size: 11px;   line-height: 1.4;  font-weight: 700; }
  .t-note { font-size: 13px;   line-height: 1.6;  font-weight: 400; }
  .num    { font-variant-numeric: tabular-nums; }
</style>
</helmet>

<div style="display: flex; flex-direction: column; height: 844px; box-sizing: border-box; background: #f7f8fa">

  <!-- ヘッダー -->
  <div style="flex-shrink: 0; background: #ffffff; border-bottom: 1px solid #e6e9ed">
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px">
      <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; border: 1px solid #e6e9ed; border-radius: 12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3c424c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </div>
      <div style="min-width: 0; flex: 1">
        <div class="t-h1" style="overflow-wrap: anywhere">インテリジェンス</div>
        <div class="t-ssm" style="margin-top: 2px; color: #5d6470">GMOサムライコンテンツスタジオ ・ GLS-A007</div>
      </div>
    </div>
    <!-- スマホは3タブ。★レギュラーでは「回」が入る -->
    <div style="display: flex; height: 48px; padding: 0 12px">
      <span class="t-list" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 1; border-bottom: 2px solid transparent; font-weight: 400; color: #5d6470">概要</span>
      <span class="t-list" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 1; border-bottom: 2px solid #005bac; color: #005bac">
        回
        <span class="t-bdg num" style="display: inline-flex; align-items: center; justify-content: center; height: 19px; min-width: 19px; padding: 0 6px; border-radius: 999px; background: #eaf4fb; color: #005bac">16</span>
      </span>
      <span class="t-list" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 1; border-bottom: 2px solid transparent; font-weight: 400; color: #5d6470">
        タスク
        <span class="t-bdg num" style="display: inline-flex; align-items: center; justify-content: center; height: 19px; min-width: 19px; padding: 0 6px; border-radius: 999px; background: #f2f4f7; color: #5d6470">12</span>
      </span>
    </div>
  </div>

  <!-- 本文 -->
  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 14px 12px">

    <!-- 次の収録（この画面でいちばん出したい1つ） -->
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; background: #ffffff; border: 1px solid #cfe4f4; border-radius: 14px">
      <span class="t-ssm" style="color: #005bac; font-weight: 700">次の収録</span>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span class="num" style="font-size: 28px; line-height: 1.15; font-weight: 800">09/10</span>
        <span class="t-sub" style="color: #5d6470">木 ・ あと 9日</span>
      </div>
      <span class="t-sub" style="color: #5d6470">用賀 SKY STUDIO ・ 2本撮り（#13 #14）</span>
      <div style="display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid #f2f4f7">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c2410e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        <span class="t-sub" style="color: #c2410e">香盤表をつくる — 09/03 まで</span>
      </div>
    </div>

    <!-- これからの回 -->
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 2px">
      <span class="t-ct">これからの回</span>
      <span class="t-ssm" style="color: #5d6470">残り 6本</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <!-- 回カード（表にせず縦積み） -->
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 14px; background: #ffffff; border: 1px solid #e6e9ed; border-radius: 14px">
        <span class="num" style="width: 34px; flex-shrink: 0; font-size: 17px; font-weight: 800">13</span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span class="t-list" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">AI 開発の現場から</span>
          <span class="t-ssm num" style="color: #5d6470">収録 09/10 ・ 公開 09/17</span>
        </div>
        <span class="t-bdg" style="display: inline-flex; align-items: center; justify-content: center; width: 62px; height: 24px; flex-shrink: 0; border-radius: 6px; background: #f2f4f7; color: #5d6470">未着手</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 14px; background: #ffffff; border: 1px solid #e6e9ed; border-radius: 14px">
        <span class="num" style="width: 34px; flex-shrink: 0; font-size: 17px; font-weight: 800">14</span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span class="t-list" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">スタジオ設備の裏側</span>
          <span class="t-ssm num" style="color: #5d6470">収録 09/10 ・ 公開 10/01</span>
        </div>
        <span class="t-bdg" style="display: inline-flex; align-items: center; justify-content: center; width: 62px; height: 24px; flex-shrink: 0; border-radius: 6px; background: #f2f4f7; color: #5d6470">未着手</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 14px; background: #ffffff; border: 1px solid #e6e9ed; border-radius: 14px">
        <span class="num" style="width: 34px; flex-shrink: 0; font-size: 17px; font-weight: 800">11</span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span class="t-list" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">生成AIと著作権</span>
          <span class="t-ssm num" style="color: #5d6470">収録済 08/27 ・ 公開 09/03</span>
        </div>
        <span class="t-bdg" style="display: inline-flex; align-items: center; justify-content: center; width: 62px; height: 24px; flex-shrink: 0; border-radius: 6px; background: #eaf4fb; color: #005bac">編集中</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 14px; background: #ffffff; border: 1px solid #e6e9ed; border-radius: 14px">
        <span class="num" style="width: 34px; flex-shrink: 0; font-size: 17px; font-weight: 800">12</span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span class="t-list" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">社内ハッカソン 密着</span>
          <span class="t-ssm num" style="color: #5d6470">収録済 08/27 ・ 公開 09/10</span>
        </div>
        <span class="t-bdg" style="display: inline-flex; align-items: center; justify-content: center; width: 62px; height: 24px; flex-shrink: 0; border-radius: 6px; background: #eaf4fb; color: #005bac">編集中</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px">
      <span class="t-sub" style="color: #005bac; font-weight: 700">納品済みの 10本 を見る</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#005bac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>
  </div>

  <!-- 下に固定した主アクション -->
  <div style="flex-shrink: 0; padding: 10px 12px 20px; background: #ffffff; border-top: 1px solid #e6e9ed">
    <button style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border: 0; border-radius: 12px; background: #005bac; font-family: inherit; font-size: 15px; font-weight: 700; color: #ffffff; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><path d="M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"/><path d="M3 10h18"/><path d="M16 19h6"/><path d="M19 16v6"/></svg>
      回をまとめて作る
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
