<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:64px; box-sizing:border-box; display:flex; align-items:center; gap:14px; padding:0 24px; background:#fff; border-bottom:1px solid #e6e9ed; flex-shrink:0">
  <img onClick="{{ onHome }}" src="logo-onair.svg" alt="GMO ONAiR" style="height:20px; width:auto; cursor:pointer; flex-shrink:0">
  <span style="width:1px; height:22px; background:#e6e9ed; flex-shrink:0"></span>

  <span style="position:relative; flex-shrink:0">
    <button onClick="{{ onToggle }}" style="display:flex; align-items:center; gap:10px; height:40px; padding:0 12px; border:1px solid #cfe4f4; border-radius:10px; background:#f4faff; font-size:13.5px; font-weight:700; line-height:1.5; color:#005bac; font-family:inherit; cursor:pointer; white-space:nowrap" style-hover="background:#eaf4fb">
      <span style="width:22px; height:22px; border-radius:7px; background:#eaf4fb; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0">
        <i data-lucide="{{ appIcon }}" style="width:14px;height:14px;color:#005bac"></i>
      </span>
      {{ appLabel }}
      <i data-lucide="chevron-down" style="width:16px;height:16px"></i>
    </button>

    <sc-if value="{{ swOpen }}" hint-placeholder-val="{{ false }}">
      <span onClick="{{ onClose }}" style="position:fixed; inset:0; z-index:55; display:block"></span>
      <span style="position:absolute; top:46px; left:0; z-index:60; display:block; width:600px; box-sizing:border-box; background:#fff; border:1px solid #e6e9ed; border-radius:16px; box-shadow:0 25px 50px -12px rgba(0,0,0,.1); padding:16px">
        <span style="display:block; font-size:11.5px; font-weight:800; line-height:1.4; color:#5d6470; margin-bottom:8px">アプリを切り替え</span>
        <span style="display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px">
          <sc-for list="{{ apps }}" as="a" hint-placeholder-count="6">
            <span onClick="{{ a.pick }}" style="display:flex; align-items:center; gap:10px; padding:10px; border:1px solid #e6e9ed; border-radius:10px; background:#fff; cursor:pointer" style-hover="border-color:#a6ceeb">
              <span style="width:28px; height:28px; border-radius:9px; background:{{ a.tint }}; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0">
                <i data-lucide="{{ a.icon }}" style="width:16px;height:16px;color:{{ a.color }}"></i>
              </span>
              <span style="flex:1; min-width:0; font-size:13.5px; font-weight:700; line-height:1.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{ a.label }}</span>
            </span>
          </sc-for>
        </span>
        <span onClick="{{ onHome }}" style="display:flex; align-items:center; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid #f2f4f7; cursor:pointer; font-size:13.5px; font-weight:700; color:#005bac">
          <i data-lucide="home" style="width:16px;height:16px"></i>トップページへ戻る
        </span>
      </span>
    </sc-if>
  </span>

  <sc-if value="{{ crumb }}" hint-placeholder-val="{{ true }}">
    <span style="font-size:12.5px; line-height:1.6; color:#5d6470; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">／ {{ crumb }}</span>
  </sc-if>

  <span style="flex:1; min-width:0"></span>

  <span style="position:relative; width:280px; flex-shrink:0">
    <i data-lucide="search" style="width:16px;height:16px;color:#5d6470;position:absolute;left:11px;top:12px"></i>
    <span style="display:flex; align-items:center; box-sizing:border-box; height:40px; padding:0 11px 0 34px; border:1px solid #e6e9ed; border-radius:7px; background:#fff; font-size:12.5px; color:#9aa1ab">案件・お客様・機材を探す
      <span style="flex:1"></span>
      <span class="num" style="font-size:11px; font-weight:700; color:#5d6470; border:1px solid #e6e9ed; border-radius:6px; padding:1px 5px">⌘K</span>
    </span>
  </span>

  <span style="position:relative; width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer" style-hover="background:#f2f4f7">
    <i data-lucide="bell" style="width:18px;height:18px;color:#5d6470"></i>
    <sc-if value="{{ notice }}" hint-placeholder-val="{{ true }}">
      <span class="num" style="position:absolute; top:6px; right:5px; min-width:16px; height:16px; box-sizing:border-box; padding:0 4px; border-radius:999px; background:#c7243a; color:#fff; font-size:10px; font-weight:800; display:inline-flex; align-items:center; justify-content:center">{{ notice }}</span>
    </sc-if>
  </span>

  <span style="display:flex; align-items:center; gap:2px; flex-shrink:0">
    <span style="width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:7px; cursor:pointer" style-hover="background:#f2f4f7"><i data-lucide="circle-help" style="width:18px;height:18px;color:#5d6470"></i></span>
    <span style="width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:7px; cursor:pointer" style-hover="background:#f2f4f7"><i data-lucide="history" style="width:18px;height:18px;color:#5d6470"></i></span>
    <span style="width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:7px; cursor:pointer" style-hover="background:#f2f4f7"><i data-lucide="plug" style="width:18px;height:18px;color:#5d6470"></i></span>
  </span>

  <span style="width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer">
    <span style="width:32px; height:32px; border-radius:999px; background:#eaf4fb; color:#005bac; display:inline-flex; align-items:center; justify-content:center; font-size:13.5px; font-weight:700">{{ userInitial }}</span>
  </span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:64},&quot;appLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;案件管理&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;appIcon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;folder-kanban&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userInitial&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;寺&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;notice&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;3&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;swOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;apps&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;onHome&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
