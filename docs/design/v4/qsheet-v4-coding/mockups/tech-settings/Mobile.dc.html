<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#f0f1f4; font-family:'LINE Seed JP',-apple-system,'Hiragino Sans',sans-serif; color:#1a1d24; -webkit-font-smoothing:antialiased; font-feature-settings:'palt' 1,'kern' 1; overflow:hidden; }
  .num { font-variant-numeric:tabular-nums; }
  [style*="cursor:pointer"] { transition: background-color .15s ease, transform .1s ease; }
  [style*="cursor:pointer"]:active { transform: scale(.98); opacity:.92; }
  @keyframes sheetUp { from { opacity:0; transform:translateY(100%); } to { opacity:1; transform:translateY(0); } }
  .nb { white-space:nowrap; }
</style>
</helmet>

<div style="width:390px; height:844px; margin:0 auto; background:#f0f1f4; position:relative; overflow:hidden; display:flex; flex-direction:column">

  <div style="flex-shrink:0; background:rgba(240,241,244,.85); backdrop-filter:blur(20px) saturate(1.6); padding:8px 16px 10px; border-bottom:1px solid rgba(0,0,0,.05)">
    <span onClick="{{ back }}" style="display:flex; align-items:center; gap:2px; color:#c2410e; font-size:14px; font-weight:600; cursor:pointer; width:fit-content; padding:4px 0">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>60周年 記念式典
    </span>
    <div style="margin-top:2px; font-size:22px; font-weight:800; letter-spacing:-.02em">{{ title }}</div>
    <div style="margin-top:8px; display:inline-flex; padding:3px; background:#e4e7eb; border-radius:10px; gap:1px; width:100%">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
        <span onClick="{{ t.pick }}" style="flex:1; display:flex; align-items:center; justify-content:center; height:30px; border-radius:8px; background:{{ t.bg }}; box-shadow:{{ t.shadow }}; color:{{ t.fg }}; font-size:12.5px; font-weight:{{ t.weight }}; cursor:pointer">{{ t.label }}</span>
      </sc-for>
    </div>
  </div>

  <div style="flex:1; min-height:0; overflow-y:auto; padding:12px 16px 92px; display:flex; flex-direction:column; gap:8px">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
      <div onClick="{{ r.pick }}" style="min-height:60px; background:#fff; border-radius:13px; padding:11px 13px; cursor:pointer; display:flex; align-items:center; gap:11px; box-shadow:0 1px 2px rgba(16,24,40,.05)">
        <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:3px">
          <span style="display:flex; align-items:center; gap:7px">
            <span class="num nb" style="font-size:13.5px; font-weight:800">{{ r.id }}</span>
            <span class="nb" style="min-width:0; font-size:12px; color:#5d6470; overflow:hidden; text-overflow:ellipsis">{{ r.label }}</span>
          </span>
          <span class="num nb" style="font-size:11px; color:{{ r.subFg }}; overflow:hidden; text-overflow:ellipsis">{{ r.sub }}</span>
        </span>
        <span style="display:inline-flex; align-items:center; height:21px; padding:0 8px; border-radius:6px; background:{{ r.stBg }}; color:{{ r.stFg }}; font-size:10px; font-weight:800; white-space:nowrap; flex-shrink:0">{{ r.stLabel }}</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c1c7cf" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m9 18 6-6-6-6"></path></svg>
      </div>
    </sc-for>

    <div style="display:flex; gap:8px; padding:11px 13px; margin-top:4px; background:#fff7ed; border-radius:12px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c2410e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
      <span style="font-size:11.5px; color:#3c424c; line-height:1.7">ここでは<strong class="nb">1台ずつ</strong>直せます。<strong class="nb">まとめて変えるのは PC で。</strong></span>
    </div>
  </div>

  <div style="position:absolute; left:0; right:0; bottom:0; padding:12px 16px 22px; background:rgba(240,241,244,.9); backdrop-filter:blur(20px); border-top:1px solid rgba(0,0,0,.05)">
    <span onClick="{{ goExport }}" style="display:flex; align-items:center; justify-content:center; gap:7px; height:52px; border-radius:14px; background:#c2410e; color:#fff; font-size:15px; font-weight:800; cursor:pointer">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
      Excelを書き出す
    </span>
  </div>

  <sc-if value="{{ isSheet }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute; inset:0; background:rgba(16,24,40,.35); z-index:100" onClick="{{ closeSheet }}">
    <div onClick="{{ stop }}" style="position:absolute; left:0; right:0; bottom:0; max-height:80%; background:#f0f1f4; border-radius:20px 20px 0 0; padding:10px 0 24px; display:flex; flex-direction:column; animation:sheetUp .26s cubic-bezier(.22,.61,.36,1) both; overflow-y:auto">
      <div style="width:36px; height:4px; border-radius:999px; background:#dcdfe4; margin:0 auto 12px; flex-shrink:0"></div>
      <div style="padding:0 20px 12px">
        <div class="num" style="font-size:19px; font-weight:800">{{ sh.id }}</div>
        <div style="font-size:12px; color:#9aa1ab; margin-top:2px">{{ sh.label }}</div>
      </div>
      <div style="margin:0 16px; background:#fff; border-radius:14px; overflow:hidden">
        <sc-for list="{{ sh.fields }}" as="f" hint-placeholder-count="5">
          <div onClick="{{ f.edit }}" style="display:flex; align-items:center; gap:12px; min-height:48px; padding:11px 14px; border-bottom:1px solid #f5f6f8; cursor:pointer">
            <span class="nb" style="width:96px; flex-shrink:0; font-size:13px; color:#3c424c">{{ f.label }}</span>
            <span class="num nb" style="flex:1; min-width:0; text-align:right; font-size:13px; font-weight:{{ f.weight }}; color:{{ f.fg }}; overflow:hidden; text-overflow:ellipsis">{{ f.value }}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c1c7cf" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m9 18 6-6-6-6"></path></svg>
          </div>
        </sc-for>
      </div>
      <p style="margin:11px 20px 0; font-size:11px; color:#9aa1ab; line-height:1.7">「未入力」のまま書き出すと、<strong class="nb">現地の設定を変えません</strong>。</p>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute; left:50%; bottom:96px; transform:translateX(-50%); z-index:200; padding:10px 16px; border-radius:999px; background:rgba(26,29,36,.94); color:#fff; font-size:12px; font-weight:700; white-space:nowrap; max-width:330px">{{ toast }}</div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { tab: 'rec', sheet: null, toast: '' };

  REC = [
    { id: 'REC1', label: '本線 PGM', videoFormat: '1920x1080p59.94', codec: 'ProRes:HQ', audioChannels: '2', slot: 'ネットワーク', filePrefix: 'GLS-A012_PGM' },
    { id: 'REC2', label: '本線 PGM 予備', videoFormat: '1920x1080p59.94', codec: 'ProRes:HQ', audioChannels: '2', slot: 'ネットワーク', filePrefix: 'GLS-A012_PGM_BK' },
    { id: 'REC3', label: 'カメラ1 ISO', videoFormat: '1920x1080p59.94', codec: 'ProRes:422', audioChannels: '2', slot: 'SSD 1', filePrefix: 'GLS-A012_CAM1' },
    { id: 'REC5', label: 'カメラ3 ISO', videoFormat: '', codec: '', audioChannels: '2', slot: 'SSD 2', filePrefix: '' },
    { id: 'REC7', label: '4K 記録用', videoFormat: '3840x2160p59.94', codec: 'H.265:High', audioChannels: '4', slot: 'ネットワーク', filePrefix: 'GLS-A012_4K' },
    { id: 'REC8', label: '予備', videoFormat: '', codec: '', audioChannels: '', slot: '', filePrefix: '' },
    { id: 'REC1-P', label: '控え PGM', videoFormat: '1920x1080p59.94', codec: 'ProRes:422', audioChannels: '2', slot: 'ネットワーク', filePrefix: 'GLS-A012_PGM_P' },
    { id: 'REC3-P', label: '控え カメラ2', videoFormat: '', codec: '', audioChannels: '', slot: '', filePrefix: '' },
  ];

  STREAM = [
    { id: 'ENC1', label: 'YouTube Pri', protocol: 'RTMP', url: 'rtmp://a.rtmp.youtube.com/live2', port: '', streamKey: 'xxxx-xxxx', aes: 'なし', passphrase: '' },
    { id: 'ENC1', label: 'YouTube Bkup', protocol: 'RTMP', url: 'rtmp://b.rtmp.youtube.com/live2', port: '', streamKey: '', aes: 'なし', passphrase: '' },
    { id: 'ENC2', label: 'Center SRT', protocol: 'SRT Caller', url: 'srt.example.invalid', port: '9000', streamKey: '', aes: 'AES-128', passphrase: 'pass-phrase' },
    { id: 'ENC5', label: 'Return Rcv', protocol: 'SRT Listener', url: '', port: '9001', streamKey: '', aes: 'なし', passphrase: '' },
  ];

  flash(msg) { this.setState({ toast: msg }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2800); }

  recRow(d) {
    const parts = [d.videoFormat, d.codec, d.audioChannels ? (d.audioChannels + 'ch') : '', d.slot].filter(Boolean);
    const filled = d.videoFormat && d.codec && d.audioChannels && d.slot;
    const none = !d.videoFormat && !d.codec && !d.audioChannels && !d.slot;
    return {
      id: d.id, label: d.label,
      sub: parts.length ? parts.join('・') : 'まだ何も決めていません',
      subFg: parts.length ? '#9aa1ab' : '#c2410e',
      stLabel: filled ? '準備完了' : none ? '未入力' : '一部だけ',
      stBg: filled ? '#e7f6ee' : none ? '#f2f4f7' : '#fff7ed',
      stFg: filled ? '#197a4b' : none ? '#9aa1ab' : '#c2410e',
      pick: () => this.setState({ sheet: { kind: 'rec', d } }),
    };
  }

  streamRow(d) {
    const bad = (d.protocol === 'RTMP' && !d.streamKey) || (d.protocol !== 'RTMP' && !d.port);
    return {
      id: d.id, label: d.label,
      sub: d.protocol + '・' + (d.protocol === 'SRT Listener' ? ('待受 ' + d.port) : (d.url + (d.port ? (':' + d.port) : ''))),
      subFg: '#9aa1ab',
      stLabel: bad ? '要確認' : '準備完了',
      stBg: bad ? '#fef6f7' : '#e7f6ee',
      stFg: bad ? '#c7243a' : '#197a4b',
      pick: () => this.setState({ sheet: { kind: 'stream', d } }),
    };
  }

  renderVals() {
    const s = this.state;
    const isRec = s.tab === 'rec';
    const rows = isRec ? this.REC.map((d) => this.recRow(d)) : this.STREAM.map((d) => this.streamRow(d));

    const sh = s.sheet;
    let shVals = {};
    if (sh) {
      const d = sh.d;
      const mk = (label, value, hint) => ({
        label, value: value || '未入力',
        fg: value ? '#1a1d24' : '#c2410e', weight: value ? 400 : 700,
        edit: () => this.flash(d.id + ' の「' + label + '」を選びます' + (hint ? ('（' + hint + '）') : '')),
      });
      shVals = sh.kind === 'rec'
        ? { id: d.id, label: d.label, fields: [
            mk('解像度', d.videoFormat, '機器が答えた候補から'),
            mk('コーデック', d.codec, '機器の綴りと完全一致'),
            mk('音声ch', d.audioChannels, ''),
            mk('収録先', d.slot, ''),
            mk('ファイル名', d.filePrefix, ''),
          ] }
        : { id: d.id, label: d.label, fields: [
            mk('プロトコル', d.protocol, ''),
            mk('宛先', d.url, ''),
            mk('ポート', d.port, ''),
            mk('ストリームキー', d.streamKey, 'RTMP では新規に必須'),
            mk('暗号化', d.aes, ''),
          ] };
    }

    return {
      hasToast: !!s.toast, toast: s.toast,
      back: () => this.flash('案件のミニアプリ一覧に戻ります'),
      title: isRec ? '収録設定' : '配信設定',
      tabs: [{ key: 'rec', label: '収録 12台' }, { key: 'stream', label: '配信 4件' }].map((t) => {
        const on = t.key === s.tab;
        return { label: t.label, pick: () => this.setState({ tab: t.key, sheet: null }), bg: on ? '#fff' : 'transparent', fg: on ? '#1a1d24' : '#5d6470', weight: on ? 800 : 700, shadow: on ? '0 1px 2px rgba(16,24,40,.15)' : 'none' };
      }),
      rows,
      goExport: () => this.flash('Excel を書き出します（点検の結果を確かめてから）'),
      isSheet: !!sh, sh: shVals,
      closeSheet: () => this.setState({ sheet: null }),
      stop: (e) => e && e.stopPropagation && e.stopPropagation(),
    };
  }
}
</script>
</body>
</html>
