[project]
name = "interpretation-backend"
version = "0.1.0"
description = "Realtime multilingual interpretation streaming backend"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "PyYAML>=6.0.2",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "redis>=5.1.0",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.9",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.13.3",
  "google-cloud-speech>=2.27.0",
  "google-cloud-texttospeech>=2.18.0",
  "google-cloud-aiplatform>=1.71.0",
  "google-genai>=0.3.0",
  "google-auth>=2.35.0",
  "google-cloud-secret-manager>=2.20.2",
  "websockets>=13.1",
  "httpx>=0.27.2",
  "structlog>=24.4.0",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
  "respx>=0.21.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
