<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/qsheet/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/qsheet/favicon_32x32.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/qsheet/favicon_144x144.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />
    <!-- LINE Seed JP は **リポジトリに同梱**しています (shared/src/client/fonts/)。
         `tokens-v4.css` が `@import` するので、ここに <link> は要りません
         (`src/index.css` が `base.css` 経由でそれを読むようになった段5 PR8 から有効)。
         入れ直しは `node scripts/vendor-fonts.mjs`。
         下の Google Fonts (Noto Sans JP / Roboto Condensed) はまだ外していません —
         CueTable・EditorSidebar・OnAir/Rundown/Prompter/AudioSupport など、
         まだ生の `style={{ fontFamily: … }}` で 'Roboto Condensed' 等を名指ししている
         箇所が残っているため（段5 PR8 の対象外。外すのはそれらを直す別 PR で）。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 800/900 と Noto Serif JP はテロップCGの出力（放送の太ゴ・横太明朝の代替）用 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;800;900&family=Noto+Serif+JP:wght@700;900&family=Roboto+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      @font-face {
        font-family: 'OswaldLatin';
        src: local('Oswald');
        unicode-range: U+0020-007F, U+00B0, U+2018-201D, U+2032-2033;
        font-weight: 100 900;
        font-display: swap;
      }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>GMO ONAiR 制作技術支援</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
