<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/daily/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/daily/favicon_32x32.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/daily/favicon_144x144.png" />
    <!-- viewport-fit=cover: ノッチの帯まで背景を敷く (色は base.css の html 側で決める) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- LINE Seed JP は 400 / 700 / 800 しか配信されていない (500/600 を要求しても返らない)。
         font-medium / font-semibold は黙って 400 / 700 に落ちる -->
    <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700;800&display=swap" rel="stylesheet" />
    <title>日常業務 - GMO ONAiR</title>
  </head>
  <!-- min-h-screen は付けない。base.css が html/body/#root に height:100% を配っており、
       min-height:100vh と食い違うとスマホで下端が切れる。 -->
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
