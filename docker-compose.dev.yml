services:
  db-dev:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onair_db_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app-dev:
    build: .
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db-dev:5432/onair_db_dev
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_CALLBACK_URL: ${OAUTH_CALLBACK_URL_DEV:-}
      CLIENT_URL: ${CLIENT_URL_DEV:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS_DEV:-}
    depends_on:
      db-dev:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_dev:
