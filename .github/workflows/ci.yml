name: CI

# ─────────────────────────────────────────────────────────────────────
# 全部の検査をここ1か所に置く。
#
# なぜ1か所か: 以前は検査 (typecheck / lint) が deploy.yml の中にしか無く、
#   **dev / main に push したあと**にしか走らなかった。つまり PR は無検査で
#   マージでき、壊れたコードが検証環境に出てから気づく形だった。
#
# 呼ばれ方は3通り:
#   1. pull_request        — マージ前のゲート (イメージは push しない)
#   2. workflow_call       — deploy.yml から。ここだけ GHCR にイメージを push する
#   3. workflow_dispatch   — 手動実行 (単発で検査だけ回したいとき)
#
# 分岐保護 (ruleset) の「必須チェック」に指定するのは下のジョブ名そのまま:
#   checks / build   ← 日本語にすると ruleset 側で打ち間違えるので ASCII 固定
# ─────────────────────────────────────────────────────────────────────

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      push_image:
        description: 'GHCR にイメージを push するか (deploy.yml から呼ばれたときだけ true)'
        type: boolean
        default: false
      image_channel:
        description: '配信チャネルのタグ (dev = 検証環境 / prod = 本番)。ブランチ名ではない'
        type: string
        default: ''
      version_tag:
        description: 'リリースタグ (例: v4.0.0)。イメージにも同じタグを付ける'
        type: string
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # 型チェック / Lint / 整合性検査
  # ============================================
  # ジョブ名 (= 必須チェックの context) は ASCII のまま置く。
  # ここを日本語にすると ruleset 側で打ち間違えても静かに「チェック無し」になる。
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ⚠️ `fetch-depth: 0` を外さないこと (レビューでの指摘 #126)。
      # 既定の浅い clone は PR のマージ ref を 1 コミットだけ持ってくるので
      # `origin/main` が存在せず、check-changelog.mjs が比べる相手を作れない。
      # あの検査は「読めなければ飛ばす」ので、**どの PR でも黙って通っていた**
      # (版の 3 か所を書き換えても緑のまま = 門があるつもりで無かった)。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --workspaces --include-workspace-root

      # ローカルの `npm run typecheck` は v4 対象の3アプリだけに絞ってある (速さのため)。
      # CI では手元の既定より広く、廃止アプリを除く全ワークスペースを見る。
      # shared/ を触ると全アプリの型が壊れ得るので、ここを絞ると気づけなくなる。
      - name: 型チェック (全ワークスペース)
        run: npm run typecheck:all

      - name: Lint (eslint)
        run: npm run lint

      # 土台の計算だけのテスト (shared)。**画面のテストは書かない** —
      # 見た目は verify-ui.mjs が実ブラウザで測るほうが確実で、73画面ぶんの
      # テストを入れても3か月で誰も直さなくなる (docs/v4-plan.md)。
      # ここに置くのは「画面を見ても間違いに気づけない計算」だけ。
      - name: Test (shared の純関数)
        run: npm test

      # server の prebuild でも走るが、ここで単体でも回す。
      # Docker ビルドが失敗する前に「共通コードの2コピーがずれた」と分かるほうが速い。
      - name: 共通コードの乖離検査 (server ↔ shared)
        run: node scripts/check-collab-parity.mjs

      # バージョン表記は package.json / CLAUDE.md / README の3か所にあり、
      # 手で揃える運用だったので実際にずれていた。機械で止める。
      - name: バージョン表記の整合
        run: npm run check:version

      # UI トークンの検査 (G2 で必須化)。`npm run lint` からも走るが、
      # **落ちた理由が「eslint なのかトークンなのか」を分けて見たい**ので単体でも回す。
      # 記録 (BASELINE) を超えたときだけ落ちる = 既存の 1,745 件は通る。
      - name: UI トークン検査 (増えたら止める)
        run: npm run check:ui-tokens

      # 本番依存の脆弱性検査 (npm audit・High 以上)。--omit=dev なので
      # devDependencies の脆弱性では落とさない (本番イメージに入るものだけを見る)。
      #
      # xlsx (R6-b・exceljs へ置換) と nodemailer (v9 へ更新) の解消をもって
      # 本番依存の High は 0 件になったのでブロッキング化した (2026-08-23)。
      # 新しい High が出たときは、このステップが赤くなって知らせる。
      - name: 本番依存の npm audit (High 以上)
        run: npm audit --omit=dev --audit-level=high

      # レンタル機材スクレイパー (Python・rental-scraper/)。
      #
      # ⚠️ **import スモークを外さないこと。** ここまで CI は Python を1行も
      # 見ていなかったため、scheduler.py が新しいモジュール (sync_requests) を
      # import するようになったのに Dockerfile の COPY へ足し忘れた変更が
      # そのままマージされ、検証環境のコンテナが ModuleNotFoundError で
      # 約4時間クラッシュし続けた (その間クロールは1件も走らず、画面は0件のまま)。
      # 単体テストのほうは Dockerfile の COPY 漏れ自体も検査する
      # (rental-scraper/test_dockerfile.py)。
      - name: レンタル機材スクレイパーの検査 (Python)
        working-directory: rental-scraper
        run: |
          python3 -m pip install --quiet -r requirements.txt
          python3 -m unittest discover -p 'test_*.py'
          python3 -c "import scheduler"  # コンテナの CMD が起動できるか

  # ============================================
  # Docker イメージのビルド
  # ============================================
  # PR では push: false で「本番と同じビルド経路が通るか」だけを見る。
  # tsc が通っても Vite のバンドルで落ちることがあるので、型チェックとは別に要る。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.push_image == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグは shell で組む。入力を直接 YAML に埋め込むとシェル差し込みの穴になるので env 経由。
      - name: イメージタグを組み立てる
        id: tags
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CHANNEL: ${{ inputs.image_channel }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          {
            echo 'list<<TAGS_EOF'
            echo "ghcr.io/${REPO}:sha-${SHA}"
            [ -n "${CHANNEL}" ] && echo "ghcr.io/${REPO}:${CHANNEL}"
            [ -n "${VERSION_TAG}" ] && echo "ghcr.io/${REPO}:${VERSION_TAG}"
            echo TAGS_EOF
          } >> "$GITHUB_OUTPUT"

      # cache-to は push するときだけ。PR のビルドでキャッシュを書き戻すと
      # main のキャッシュを押し出して、次のデプロイが丸ごと再ビルドになる。
      - name: Build (and push)
        uses: docker/build-push-action@v6
        env:
          # このリポジトリは artifact ストレージ上限に達しており、
          # ビルドレコードの upload は毎回警告になるだけで使い道がない。
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: .
          push: ${{ inputs.push_image == true }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: ${{ inputs.push_image == true && 'type=gha,mode=max' || '' }}
