name: Deploy to Dev (dev.gmo-onair.jp)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy app-dev via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # 1. devブランチのworktreeを最新に更新
            cd /root/gmo-onair-dev
            git fetch origin dev
            git pull origin dev

            # 2. app-dev だけリビルド・再起動
            cd /root/gmo-onair
            docker compose build app_dev
            docker compose up -d app_dev

            echo "✅ Dev deploy completed at $(date)"
