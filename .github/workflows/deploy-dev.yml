name: Deploy to Dev (dev.gmo-onair.jp)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Dev VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            DEV_DIR="/opt/gmo-onair-dev"

            # 初回: ディレクトリがなければ clone
            if [ ! -d "$DEV_DIR/.git" ]; then
              mkdir -p "$DEV_DIR"
              git clone https://github.com/terai-takehiro/gmo-onair.git "$DEV_DIR"
            fi

            cd "$DEV_DIR"
            git fetch origin
            git checkout dev
            git pull origin dev

            # .env がなければ本番の .env をベースにコピー
            if [ ! -f "$DEV_DIR/.env" ]; then
              cp /opt/gmo-onair/.env "$DEV_DIR/.env"
              echo "" >> "$DEV_DIR/.env"
              echo "# --- Dev overrides ---" >> "$DEV_DIR/.env"
              echo "OAUTH_CALLBACK_URL_DEV=http://dev.gmo-onair.jp/api/v1/internal/auth/callback" >> "$DEV_DIR/.env"
              echo "CLIENT_URL_DEV=http://dev.gmo-onair.jp" >> "$DEV_DIR/.env"
              echo "ALLOWED_ORIGINS_DEV=http://dev.gmo-onair.jp" >> "$DEV_DIR/.env"
            fi

            docker compose -f docker-compose.dev.yml up -d --build
            echo "✅ Dev deploy completed at $(date)"
