name: Interpretation / backend

on:
  push:
    branches: [dev, main]
    paths:
      - "interpretation/backend/**"
      - ".github/workflows/interpretation-backend.yml"
  pull_request:
    paths:
      - "interpretation/backend/**"
      - ".github/workflows/interpretation-backend.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Target environment
        type: choice
        required: true
        default: dev
        options: [dev, prod]

concurrency:
  group: interp-backend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interpretation/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: interpretation/backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check app
      - run: mypy app

  deploy:
    name: build + deploy (${{ github.event.inputs.target || (github.ref_name == 'main' && 'prod' || 'dev') }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ENV_NAME: ${{ github.event.inputs.target || (github.ref_name == 'main' && 'prod' || 'dev') }}
      REGION: asia-northeast1
      NAME_PREFIX: interp
      SERVICE_BACKEND: interp-${{ github.event.inputs.target || (github.ref_name == 'main' && 'prod' || 'dev') }}-backend
      REPO: interp-${{ github.event.inputs.target || (github.ref_name == 'main' && 'prod' || 'dev') }}-containers
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CICD_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push container
        working-directory: interpretation/backend
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPO}/backend:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run Alembic migrations (Cloud Run Job)
        run: |
          JOB_NAME="${SERVICE_BACKEND}-migrate"
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --service-account "${{ vars.GCP_BACKEND_RUNTIME_SA }}" \
            --vpc-connector "${NAME_PREFIX}-${ENV_NAME}-vpcconn" \
            --vpc-egress private-ranges-only \
            --set-secrets "DATABASE_URL=${NAME_PREFIX}-${ENV_NAME}-db-url:latest" \
            --command "alembic" \
            --args "upgrade,head" \
            --max-retries 0 \
            --task-timeout 600 \
            --quiet || \
          gcloud run jobs update "$JOB_NAME" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --quiet
          gcloud run jobs execute "$JOB_NAME" \
            --region "$REGION" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --wait

      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy "$SERVICE_BACKEND" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --service-account "${{ vars.GCP_BACKEND_RUNTIME_SA }}" \
            --vpc-connector "${NAME_PREFIX}-${ENV_NAME}-vpcconn" \
            --vpc-egress private-ranges-only \
            --port 8080 \
            --timeout 3600 \
            --concurrency 50 \
            --min-instances 0 \
            --max-instances 5 \
            --set-env-vars "ENVIRONMENT=${ENV_NAME},GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GCP_REGION=${REGION}" \
            --set-secrets "DATABASE_URL=${NAME_PREFIX}-${ENV_NAME}-db-url:latest,REDIS_URL=${NAME_PREFIX}-${ENV_NAME}-redis-url:latest,JWT_SECRET=${NAME_PREFIX}-${ENV_NAME}-auth-jwt-secret:latest" \
            --allow-unauthenticated \
            --quiet
