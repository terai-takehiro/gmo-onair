name: Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# 同じブランチへの複数プッシュが重なった場合、最新のみ実行
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ============================================
  # 検証環境 (dev.gmo-onair.jp) — dev push で自動
  # ============================================
  deploy-dev:
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to dev environment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
            set -e
            # dev worktree を最新に更新
            cd /root/gmo-onair-dev
            git fetch origin dev
            git reset --hard origin/dev
            # app_dev のみ再ビルド＆再起動 (本番には触れない)
            cd /root/gmo-onair
            git fetch origin main
            git reset --hard origin/main
            # v2.5.0: dev ブランチの nginx config / docker-compose.yml の変更を main worktree に反映してから
            # app_dev / nginx を起動する。dev branch を /root/gmo-onair (main worktree) にコピーすることで、
            # 相対パスの volume マウント (./nginx/gmo-onair.conf) と環境変数 (AUTH_MODE 等) が dev 版を読む。
            # 次回 prod デプロイ時の git reset --hard origin/main で自動的に main 側に戻る。
            # v2.5.2: cp の位置を app_dev 起動 *前* に移動 (順序バグ修正)
            cp /root/gmo-onair-dev/nginx/gmo-onair.conf /root/gmo-onair/nginx/gmo-onair.conf
            cp /root/gmo-onair-dev/docker-compose.yml /root/gmo-onair/docker-compose.yml
            docker compose build --no-cache app_dev
            docker compose stop app_dev || true
            docker compose rm -f app_dev || true
            docker compose up -d --no-deps app_dev
            # nginx を再作成 (volume マウント変更 / config 変更を反映)
            docker compose stop nginx || true
            docker compose rm -f nginx || true
            docker compose up -d --no-deps nginx
            echo "✓ Dev deploy complete: $(date) — $(cd /root/gmo-onair-dev && git log --oneline -1)"
          ENDSSH

  # ============================================
  # 本番環境 (gmo-onair.jp) — main push で自動
  # ============================================
  deploy-prod:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
            set -e
            cd /root/gmo-onair
            git fetch origin main
            git reset --hard origin/main
            # app_prod のみ再ビルド＆再起動 (検証には触れない)
            docker compose build --no-cache app_prod
            docker compose stop app_prod || true
            docker compose rm -f app_prod || true
            docker compose up -d --no-deps app_prod
            # サーバー起動ログを確認
            echo "=== Container logs (first 10s) ==="
            sleep 10
            docker logs --tail=50 gmo-onair-app_prod-1 2>&1 || docker logs --tail=50 $(docker ps -aq -f name=app_prod | head -1) 2>&1 || true
            echo "=== Health check ==="
            sleep 10
            curl -sf http://localhost:3000/health && echo "✓ Health check passed" || echo "⚠ Health check failed"
            echo "=== Container status ==="
            docker ps -a | grep app_prod || true
            echo "✓ Prod deploy complete: $(date) — $(git log --oneline -1)"
          ENDSSH
