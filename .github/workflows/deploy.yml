name: Deploy to CoNoHa VPS

on:
  push:
    branches:
      - main

# 同時実行防止 — 最新のデプロイのみ実行
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/gmo-onair
            git fetch origin main
            git reset --hard origin/main
            echo "=== VPS HEAD ==="
            git log --oneline -3
            echo "=== Qsheet index.html (source) line 19-22 ==="
            sed -n '19,22p' client-qsheet/index.html
            echo "=== Rebuilding ==="
            docker compose down
            docker compose build --no-cache 2>&1 | tail -5
            docker compose up -d
            sleep 8
            echo "=== Qsheet dist index.html line 1-5 ==="
            docker compose exec -T app head -5 /app/client-qsheet/dist/index.html
            echo "=== Done ==="
            docker compose logs --tail=3 app
            echo "✅ Deploy v0.8.8 at $(date)"
