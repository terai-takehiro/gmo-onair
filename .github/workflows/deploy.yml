name: Deploy to CoNoHa VPS

on:
  push:
    branches:
      - main

# 同時実行防止 — 最新のデプロイのみ実行
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/gmo-onair
            git fetch origin main
            git reset --hard origin/main
            echo "=== HEAD ==="
            git log --oneline -1
            echo "=== Building (no-cache) ==="
            docker compose down
            docker compose build --no-cache 2>&1 | grep -E "ERROR|error|DONE|built in|✓" | tail -20
            echo "=== Starting ==="
            docker compose up -d
            sleep 8
            echo "=== Server logs ==="
            docker compose logs --tail=10 app
            echo "=== Verify qsheet dist ==="
            docker compose exec -T app ls -la /app/client-qsheet/dist/ 2>/dev/null || echo "QSHEET DIST NOT FOUND"
            docker compose exec -T app head -1 /app/client-qsheet/dist/index.html 2>/dev/null || echo "NO INDEX.HTML"
            echo "✅ Deploy v0.8.5 completed at $(date)"
