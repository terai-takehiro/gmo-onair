name: Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# 同じブランチへの複数プッシュが重なった場合、最新のみ実行
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────
# VPS 上のレイアウト (デプロイ前提):
#   /root/gmo-onair      ← main ブランチの worktree (prod 専用)
#   /root/gmo-onair-dev  ← dev ブランチの worktree (dev 専用)
#
# どちらの worktree にもリポジトリ全体 (docker-compose.yml + nginx/) が含まれる。
# 両 worktree で `docker compose -p gmo-onair` という project 名を共有することで
# app_prod / app_dev / nginx / db のネットワーク・ボリューム・DB を 1 セットで動かす。
#
# 設計原則:
#   - dev デプロイは /root/gmo-onair-dev だけを参照 (main worktree を一切触らない)
#   - prod デプロイは /root/gmo-onair だけを参照 (dev worktree を一切触らない)
#   - 「次回デプロイで戻る」等の暗黙リセットには依存しない
#   - --no-deps + --force-recreate でデプロイ対象外サービスへの影響を最小化
# ─────────────────────────────────────────────────────────────────────

jobs:
  # ============================================
  # 検証環境 (dev.gmo-onair.jp) — dev push で自動
  # ============================================
  deploy-dev:
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to dev environment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
            set -euo pipefail

            # 1) dev worktree を最新に更新
            #    Why: 以降のすべての操作 (compose build / volume マウント / nginx config) が
            #         この worktree のファイルを直接参照するため、最初に同期する。
            cd /root/gmo-onair-dev
            git fetch origin dev
            git reset --hard origin/dev

            # 2) dev worktree の docker-compose.yml を明示的に指定して dev 操作を行う。
            #    Why -f: cp で main worktree (/root/gmo-onair) を汚さない。
            #            dev branch の compose / nginx 設定変更が確実に反映される。
            #    Why -p gmo-onair: prod デプロイと同じ project 名にすることで、
            #            app_prod / db / nginx を共有 (別プロジェクトとして並走しない)。
            COMPOSE_DEV="docker compose -p gmo-onair -f /root/gmo-onair-dev/docker-compose.yml"

            # 3) app_dev のみ再ビルド & 再作成。
            #    Why --no-cache: dev branch のソース変更を確実に bundle に反映するため
            #                    (Docker レイヤーキャッシュ由来の古い JS 事故を防止)。
            #    Why --no-deps:  app_prod / db / nginx を巻き込まない。
            #    Why --force-recreate: 既存コンテナを停止せず一気に新コンテナへ置換。
            $COMPOSE_DEV build --no-cache app_dev
            $COMPOSE_DEV up -d --no-deps --force-recreate app_dev

            # 4) nginx を dev の compose + dev の nginx config で再作成。
            #    Why dev 側で管理: 1 つの nginx コンテナが prod / dev 両方の server_name を捌くので、
            #         「最新のニーズに沿った設定」を保持しているのは常に dev branch (main は dev から merge を受ける運用)。
            #         prod デプロイ側は nginx に触れない (下記 deploy-prod 参照)。
            $COMPOSE_DEV up -d --no-deps --force-recreate nginx

            # 5) 診断: app_dev / nginx の起動状況を deploy ログに必ず吐く。
            #    502 Bad Gateway 等のトラブル時にここが原因特定の唯一の窓口になる。
            #
            # NOTE: 単一引用 heredoc 内では \$(...) と書くと remote bash が
            # \\$ を literal $ と解釈して後続の ( で構文エラーになる。
            # heredoc が変数展開を抑止しているので、リモート側で実行したい
            # コマンド置換は素直に $(...) と書く。
            sleep 15
            echo "=== docker compose ps ==="
            $COMPOSE_DEV ps app_dev nginx db || true

            echo "=== app_dev container logs (last 80 lines) ==="
            APP_DEV_CID=$(docker ps -aq -f name=gmo-onair-app_dev | head -1)
            if [ -n "$APP_DEV_CID" ]; then
              docker logs --tail=80 "$APP_DEV_CID" 2>&1 || true
            else
              echo "⚠ app_dev container not found"
            fi

            echo "=== nginx container logs (last 40 lines) ==="
            NGINX_CID=$(docker ps -aq -f name=gmo-onair-nginx | head -1)
            if [ -n "$NGINX_CID" ]; then
              docker logs --tail=40 "$NGINX_CID" 2>&1 || true
            else
              echo "⚠ nginx container not found"
            fi

            echo "=== docker network inspection (gmo-onair_default) ==="
            docker network inspect gmo-onair_default --format '{{range .Containers}}{{.Name}} {{.IPv4Address}}{{println}}{{end}}' 2>&1 || true

            echo "=== nginx → app_dev 名前解決テスト (内部 DNS) ==="
            if [ -n "$NGINX_CID" ]; then
              docker exec "$NGINX_CID" sh -c 'getent hosts app_dev || nslookup app_dev || echo "name resolution failed"' 2>&1 || true
            fi

            echo "=== app_dev /health (コンテナ内部から直接叩く) ==="
            if [ -n "$APP_DEV_CID" ]; then
              docker exec "$APP_DEV_CID" sh -c 'wget -qO- http://localhost:3000/health || curl -sf http://localhost:3000/health || echo "app_dev not responding internally"' 2>&1 || true
            fi

            echo "=== nginx → app_dev:3000 接続テスト ==="
            if [ -n "$NGINX_CID" ]; then
              docker exec "$NGINX_CID" sh -c 'wget -qO- http://app_dev:3000/health 2>&1 || curl -sf http://app_dev:3000/health 2>&1 || echo "nginx cannot reach app_dev:3000"' 2>&1 || true
            fi

            echo "=== External health check ==="
            curl -sfk https://dev.gmo-onair.jp/health && echo "✓ dev health OK" || echo "⚠ external health check failed (上記 logs を確認)"

            echo "✓ Dev deploy complete (logs above)"
          ENDSSH

  # ============================================
  # 本番環境 (gmo-onair.jp) — main push で自動
  # ============================================
  deploy-prod:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
            set -euo pipefail

            # 1) main worktree を最新に更新。dev worktree (/root/gmo-onair-dev) は一切触らない。
            cd /root/gmo-onair
            git fetch origin main
            git reset --hard origin/main

            # 2) main の docker-compose.yml を明示。-p で project 名を共有。
            COMPOSE_PROD="docker compose -p gmo-onair -f /root/gmo-onair/docker-compose.yml"

            # 3) app_prod のみ再ビルド & 再作成。
            #    Why nginx に触れない: nginx は dev デプロイで最新化済み。prod 側で
            #         main の nginx config を強制すると、dev branch にしかない設定変更
            #         (例: dev block の Basic 認証撤去) が消えてしまう。
            #         nginx 設定を本番に反映したい場合は、まず dev → main を merge してから
            #         dev デプロイ → prod デプロイの順で実施する (dev 側で nginx 再起動が走る)。
            $COMPOSE_PROD build --no-cache app_prod
            $COMPOSE_PROD up -d --no-deps --force-recreate app_prod

            # 4) サーバー起動ログ + ヘルスチェック
            echo "=== Container logs (first 10s) ==="
            sleep 10
            APP_PROD_CID=$(docker ps -aq -f name=gmo-onair-app_prod | head -1)
            if [ -n "$APP_PROD_CID" ]; then
              docker logs --tail=50 "$APP_PROD_CID" 2>&1 || true
            else
              echo "⚠ app_prod container not found"
            fi

            echo "=== Health check ==="
            sleep 10
            curl -sf http://localhost:3000/health && echo "✓ Health check passed" || echo "⚠ Health check failed"

            echo "=== Container status ==="
            $COMPOSE_PROD ps app_prod
            echo "✓ Prod deploy complete"
          ENDSSH
