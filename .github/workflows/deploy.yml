name: Deploy to CoNoHa VPS

on:
  push:
    branches:
      - main

# 同時実行防止 — 最新のデプロイのみ実行
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/gmo-onair
            git fetch origin main
            git reset --hard origin/main
            echo "=== VPS HEAD: $(git log --oneline -1) ==="
            echo "=== Full rebuild ==="
            docker compose down
            docker compose build --no-cache 2>&1 | grep -E "client-qsheet|ERROR|error TS|DONE|built in" | head -20
            docker compose up -d
            sleep 8
            echo "=== Dist check ==="
            docker compose exec -T app cat /app/client-qsheet/dist/index.html
            echo "=== Server ==="
            docker compose logs --tail=3 app
            echo "✅ v0.8.9 at $(date)"
