name: Deploy

# ─────────────────────────────────────────────────────────────────────
# デプロイの入口は2つだけ (v3.1.5 までの「dev ブランチ / main ブランチ」を廃止)
#
#   ① main に push (= PR がマージされた)     → 検証環境 dev.gmo-onair.jp
#   ② GitHub で Release を公開 (タグ vX.Y.Z) → 本番   gmo-onair.jp
#
# なぜこの形か: 以前は「dev ブランチ = 検証」「main ブランチ = 本番」で、
#   本番に出すには dev を main にマージする必要があった。ところが実際には
#   main と dev の中身は常に同じになっていた (差分0) ので、ブランチを2本
#   持つ意味が無く、「どっちが正なのか」を新しく入った人に説明できなかった。
#   いまは **main が唯一の正**、**本番に出た瞬間 = タグ** という形にしてある。
#   タグが打たれるので「どのコミットが本番か」「v3.1.4 に戻したい」が
#   GitHub の Releases 画面だけで完結する (以前はタグが1つも無かった)。
#
# 検査はしない (できない) ようにしてある: どちらの経路も ci.yml を
#   `needs` で通るので、**型エラー・Lint 違反があればデプロイは始まらない**。
#
# VPS 上のレイアウト:
#   /root/gmo-onair      ← 本番用 worktree (本番デプロイだけが触る)
#   /root/gmo-onair-dev  ← 検証用 worktree (検証デプロイだけが触る)
#
#   どちらにもリポジトリ全体 (docker-compose.yml + nginx/) が入っている。
#   両方が `docker compose -p gmo-onair` を共有することで app_prod / app_dev /
#   nginx / db をネットワーク・ボリューム 1 セットで動かす。
#   ブランチではなく **コミットを直接 checkout (detached HEAD)** する。
#   これでタグからでもブランチからでも同じ手順で出せる。
#
# GHCR のイメージタグ `:dev` `:prod` は**配信チャネル名**で、ブランチ名ではない。
#   docker-compose.yml の `image:` 既定値がこの名前なので変えていない。
#
# ロールバック: Releases から1つ前のタグを選んで "Re-run" するか、VPS で
#   `APP_IMAGE_PROD=ghcr.io/<repo>:sha-<旧commit> docker compose ... up -d app_prod`
# ─────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'デプロイ先 (デプロイするコミットは、この実行を開始するときに選んだブランチ/タグ)'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

# ワークフロー全体の排他は**デプロイ先ごと**に分ける。
#
# 以前は `deploy-${{ github.ref_name }}` (ブランチ名のみ) + cancel-in-progress: true
# だったため、**同じブランチから検証と本番を続けて出すと、後から投げた本番が
# 実行中の検証を打ち切っていた** (実際に起きた)。検証と本番は別のものなので、
# 一方が他方を止めてよい理由がない。
#
# 環境ごとの排他 (同じ環境への二重デプロイを防ぐ) は各ジョブの
# `concurrency: deploy-staging / deploy-production` が担う。こちらは
# cancel-in-progress: false なので、走っているデプロイは最後まで完走する。
concurrency:
  group: deploy-${{ github.ref_name }}-${{ inputs.target || (github.event_name == 'release' && 'production') || 'staging' }}
  cancel-in-progress: true

jobs:
  # ============================================
  # どこへ・どのコミットを出すのかを1か所で決める
  # ============================================
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      image_channel: ${{ steps.resolve.outputs.image_channel }}
      version_tag: ${{ steps.resolve.outputs.version_tag }}
      deploy_ref: ${{ steps.resolve.outputs.deploy_ref }}
    steps:
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            release)           channel=production ;;
            workflow_dispatch) channel="$TARGET" ;;
            *)                 channel=staging ;;
          esac

          if [ "$channel" = "production" ]; then
            image_channel=prod
          else
            image_channel=dev
          fi

          # Release 経由のときだけ、イメージにもバージョンタグを付ける
          version_tag=''
          if [ "$EVENT" = "release" ]; then
            version_tag="$REF_NAME"
          fi

          {
            echo "channel=$channel"
            echo "image_channel=$image_channel"
            echo "version_tag=$version_tag"
            echo "deploy_ref=$REF_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "### デプロイ: \`$channel\` ← \`$REF_NAME\` (${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # 検査 + イメージビルド (ci.yml を呼ぶ)
  # ============================================
  # ここが失敗するとデプロイジョブは動かない。検査の中身は ci.yml 側にある
  # (PR で走るものと完全に同じもの — 2か所に書くとどちらかが古くなる)。
  ci:
    needs: meta
    uses: ./.github/workflows/ci.yml
    with:
      push_image: true
      image_channel: ${{ needs.meta.outputs.image_channel }}
      version_tag: ${{ needs.meta.outputs.version_tag }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ============================================
  # 検証環境 (dev.gmo-onair.jp)
  # ============================================
  staging:
    needs: [meta, ci]
    if: needs.meta.outputs.channel == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    # 環境ごとの排他。preview.yml も同じグループを使うので、
    # 「プレビューを出している最中に main のデプロイが割り込む」が起きない。
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://dev.gmo-onair.jp

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to staging
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "GHCR_USER='${{ github.actor }}' GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' DEPLOY_SHA='${{ github.sha }}' bash -s" << 'ENDSSH'
            set -euo pipefail

            # 1) 検証用 worktree を、デプロイ対象のコミットそのものに合わせる。
            #    Why: compose ファイル / nginx config / .env 参照 / フォールバック
            #         ビルドのコンテキストがこの worktree のファイルを見るため。
            #    Why detached: ブランチではなくコミットを直接指す。タグからでも
            #         ブランチからでも同じ1行で出せる。
            cd /root/gmo-onair-dev
            git fetch origin --prune --tags --force

            # nginx の設定が今回の変更で動いたかどうかを、切り替えの前後で比べる。
            # Why: nginx コンテナは本番と検証の両方の server_name を1つで捌いている。
            #      毎回 force-recreate すると、検証デプロイのたびに本番向けの
            #      リバースプロキシが一瞬落ちる。設定が変わっていないなら触らない。
            NGINX_BEFORE=$(cat nginx/*.conf 2>/dev/null | md5sum | cut -d' ' -f1)
            git checkout --force --detach "$DEPLOY_SHA"
            NGINX_AFTER=$(cat nginx/*.conf 2>/dev/null | md5sum | cut -d' ' -f1)

            # 2) 検証側の compose ファイルを明示して操作する。
            #    Why -f: 本番 worktree (/root/gmo-onair) を一切汚さない。
            #    Why -p gmo-onair: 本番デプロイと同じ project 名にして
            #            app_prod / db / nginx を共有する (別プロジェクトにしない)。
            #    Why --env-file: secrets (DB_PASSWORD / JWT_SECRET 等) は
            #            /root/gmo-onair/.env にだけ置かれているので明示参照。
            COMPOSE_DEV="docker compose -p gmo-onair --env-file /root/gmo-onair/.env -f /root/gmo-onair-dev/docker-compose.yml"

            # 3) GHCR からビルド済みイメージを pull (VPS 上ではビルドしない)。
            #    pull に失敗した場合 (GHCR 障害等) のみ VPS 上でのビルドに落ちる。
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            if $COMPOSE_DEV pull app_dev; then
              echo "✓ pulled prebuilt image from GHCR"
            else
              echo "⚠ GHCR pull failed — falling back to on-VPS build"
              $COMPOSE_DEV build --no-cache app_dev
            fi
            $COMPOSE_DEV up -d --no-deps --force-recreate app_dev

            # 4) nginx は設定が変わったときだけ作り直す。
            if [ "$NGINX_BEFORE" != "$NGINX_AFTER" ]; then
              echo "→ nginx の設定が変わったので再作成する"
              $COMPOSE_DEV up -d --no-deps --force-recreate nginx
            else
              echo "→ nginx の設定は変わっていないので触らない"
            fi

            # 5) 後片付け: 認証情報を残さない + タグ付け替えで dangling になった旧イメージを削除
            docker logout ghcr.io || true
            docker image prune -f || true

            # 6) 診断: 502 等のトラブル時に原因を特定できる唯一の窓口なので必ず吐く。
            #
            # NOTE: 単一引用 heredoc 内では \$(...) と書くと remote bash が
            # \\$ を literal $ と解釈して後続の ( で構文エラーになる。
            # heredoc が変数展開を抑止しているので素直に $(...) と書く。
            sleep 15
            echo "=== docker compose ps ==="
            $COMPOSE_DEV ps app_dev nginx db || true

            echo "=== app_dev container logs (last 80 lines) ==="
            APP_DEV_CID=$(docker ps -aq -f name=gmo-onair-app_dev | head -1)
            if [ -n "$APP_DEV_CID" ]; then
              docker logs --tail=80 "$APP_DEV_CID" 2>&1 || true
            else
              echo "⚠ app_dev container not found"
            fi

            echo "=== nginx container logs (last 40 lines) ==="
            NGINX_CID=$(docker ps -aq -f name=gmo-onair-nginx | head -1)
            if [ -n "$NGINX_CID" ]; then
              docker logs --tail=40 "$NGINX_CID" 2>&1 || true
            else
              echo "⚠ nginx container not found"
            fi

            echo "=== docker network inspection (gmo-onair_default) ==="
            docker network inspect gmo-onair_default --format '{{range .Containers}}{{.Name}} {{.IPv4Address}}{{println}}{{end}}' 2>&1 || true

            echo "=== nginx → app_dev 名前解決テスト (内部 DNS) ==="
            if [ -n "$NGINX_CID" ]; then
              docker exec "$NGINX_CID" sh -c 'getent hosts app_dev || nslookup app_dev || echo "name resolution failed"' 2>&1 || true
            fi

            echo "=== app_dev /health (コンテナ内部から直接叩く) ==="
            if [ -n "$APP_DEV_CID" ]; then
              docker exec "$APP_DEV_CID" sh -c 'wget -qO- http://localhost:3000/health || curl -sf http://localhost:3000/health || echo "app_dev not responding internally"' 2>&1 || true
            fi

            echo "=== nginx → app_dev:3000 接続テスト ==="
            if [ -n "$NGINX_CID" ]; then
              docker exec "$NGINX_CID" sh -c 'wget -qO- http://app_dev:3000/health 2>&1 || curl -sf http://app_dev:3000/health 2>&1 || echo "nginx cannot reach app_dev:3000"' 2>&1 || true
            fi

            echo "=== External health check ==="
            curl -sfk https://dev.gmo-onair.jp/health && echo "✓ staging health OK" || echo "⚠ external health check failed (上記 logs を確認)"

            echo "✓ Staging deploy complete (logs above)"
          ENDSSH

  # ============================================
  # 本番環境 (gmo-onair.jp)
  # ============================================
  # environment: production に「承認が必要」を設定しておくと、
  # Release を公開してもここで一度止まり、承認した人の記録が残る
  # (設定手順: docs/ops/github-repo-settings.md)。
  production:
    needs: [meta, ci]
    if: needs.meta.outputs.channel == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://gmo-onair.jp

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "GHCR_USER='${{ github.actor }}' GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' DEPLOY_SHA='${{ github.sha }}' DEPLOY_REF='${{ needs.meta.outputs.deploy_ref }}' bash -s" << 'ENDSSH'
            set -euo pipefail

            # 1) 本番 worktree をリリース対象のコミットに合わせる。
            #    検証 worktree (/root/gmo-onair-dev) は一切触らない。
            cd /root/gmo-onair
            git fetch origin --prune --tags --force
            git checkout --force --detach "$DEPLOY_SHA"
            echo "→ 本番を $DEPLOY_REF ($DEPLOY_SHA) に合わせた"

            # 2) 本番の compose を明示。-p で project 名を共有。
            COMPOSE_PROD="docker compose -p gmo-onair -f /root/gmo-onair/docker-compose.yml"

            # 3) GHCR からビルド済みイメージを pull。失敗時のみ VPS 上ビルドに落ちる。
            #    Why nginx に触れない: nginx は検証デプロイ側で最新化される。
            #         本番側で古いタグの nginx config を強制すると、main にしかない
            #         設定変更が消えてしまう。nginx 設定を本番に効かせたい場合は
            #         main にマージして検証デプロイを回す (そこで nginx が再作成される)。
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            if $COMPOSE_PROD pull app_prod; then
              echo "✓ pulled prebuilt image from GHCR"
            else
              echo "⚠ GHCR pull failed — falling back to on-VPS build"
              $COMPOSE_PROD build --no-cache app_prod
            fi
            $COMPOSE_PROD up -d --no-deps --force-recreate app_prod

            # 後片付け
            docker logout ghcr.io || true
            docker image prune -f || true

            # 4) 起動ログ + ヘルスチェック
            echo "=== Container logs (first 10s) ==="
            sleep 10
            APP_PROD_CID=$(docker ps -aq -f name=gmo-onair-app_prod | head -1)
            if [ -n "$APP_PROD_CID" ]; then
              docker logs --tail=50 "$APP_PROD_CID" 2>&1 || true
            else
              echo "⚠ app_prod container not found"
            fi

            echo "=== Health check ==="
            sleep 10
            curl -sf http://localhost:3000/health && echo "✓ Health check passed" || echo "⚠ Health check failed"

            echo "=== Container status ==="
            $COMPOSE_PROD ps app_prod
            echo "✓ Production deploy complete"
          ENDSSH
