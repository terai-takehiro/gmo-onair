name: Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  # ============================================
  # 検証環境 (dev.gmo-onair.jp) — dev push で自動
  # ============================================
  deploy-dev:
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to dev environment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
            set -e
            # dev worktree を最新に更新
            cd /root/gmo-onair-dev
            git fetch origin dev
            git reset --hard origin/dev
            # app_dev のみ再ビルド＆再起動 (本番には触れない)
            cd /root/gmo-onair
            git fetch origin main
            git reset --hard origin/main
            docker compose build app_dev
            docker compose up -d --force-recreate --no-deps app_dev
            # nginx を再作成 (volume マウント変更を反映)
            docker compose up -d --force-recreate --no-deps nginx
            echo "✓ Dev deploy complete: $(date) — $(cd /root/gmo-onair-dev && git log --oneline -1)"
          ENDSSH

  # ============================================
  # 本番環境 (gmo-onair.jp) — main push で自動
  # ============================================
  deploy-prod:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
            set -e
            cd /root/gmo-onair
            git fetch origin main
            git reset --hard origin/main
            # app_prod のみ再ビルド＆再起動 (検証には触れない)
            docker compose build app_prod
            docker compose up -d --force-recreate --no-deps app_prod
            echo "✓ Prod deploy complete: $(date) — $(git log --oneline -1)"
          ENDSSH
