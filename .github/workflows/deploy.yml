name: Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  # ============================================
  # 検証環境 (dev.gmo-onair.jp) — dev push で自動
  # ============================================
  deploy-dev:
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to dev environment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # dev worktree を最新に更新
            cd /root/gmo-onair-dev
            git fetch origin dev
            git reset --hard origin/dev
            # app_dev のみ再ビルド＆再起動 (本番には触れない)
            cd /root/gmo-onair
            git fetch origin main
            git reset --hard origin/main
            docker compose build app_dev
            docker compose stop app_dev || true
            docker compose rm -f app_dev || true
            docker compose up -d app_dev
            # nginx を再作成 (volume マウント変更を反映)
            docker compose stop nginx || true
            docker compose rm -f nginx || true
            docker compose up -d nginx
            echo "✓ Dev deploy complete: $(date) — $(cd /root/gmo-onair-dev && git log --oneline -1)"

  # ============================================
  # 本番環境 (gmo-onair.jp) — main push で自動
  # ============================================
  deploy-prod:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/gmo-onair
            git fetch origin main
            git reset --hard origin/main
            # app_prod のみ再ビルド＆再起動 (検証には触れない)
            docker compose build app_prod
            docker compose stop app_prod || true
            docker compose rm -f app_prod || true
            docker compose up -d app_prod
            echo "✓ Prod deploy complete: $(date) — $(git log --oneline -1)"
