version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onair_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./nginx/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/10-create-dbs.sh:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/onair_db
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- Qsheet Editor (キューシートエディタ) ---
  qsheet-app:
    build:
      context: ${QSHEET_PATH:-../GMO-Qsheet-Editor}
    ports:
      - "3456:3456"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/qsheet_db
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3456/auth/google/callback}
      MASTER_EMAIL: ${MASTER_EMAIL:-}
      NODE_ENV: production
      PORT: 3456
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- EventStamp (インタラクティブ演出支援) ---
  eventstamp-app:
    build:
      context: ${EVENTSTAMP_PATH:-../gmo_eventstamp}
      dockerfile: ${EVENTSTAMP_DOCKERFILE:-Dockerfile}
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      BASE_URL: ${EVENTSTAMP_BASE_URL:-http://localhost:3001}
      NODE_ENV: production
      SESSION_DURATION_HOURS: 24
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/api/auth/google/callback}
    volumes:
      - eventstamp-data:/app/db
      - eventstamp-uploads:/app/public/uploads
    restart: unless-stopped

volumes:
  pgdata:
  eventstamp-data:
  eventstamp-uploads:
