# =============================================
# GMO ONAiR — 本番 + 開発 2環境構成
# gmo-onair.jp (本番) / dev.gmo-onair.jp (開発)
# =============================================

services:
  # ──────────────────────────────────────
  # PostgreSQL (共有インスタンス、DB名で分離)
  # ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # 新規クラスタ初期化時に UTF-8 を強制（既存クラスタには影響しない）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      LANG: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────
  # 本番アプリ (gmo-onair.jp)
  # ──────────────────────────────────────
  app_prod:
    # デプロイは GitHub Actions がビルドして GHCR に push したイメージを pull して使う
    # (deploy.yml 参照)。APP_IMAGE_PROD を指定すればロールバック用の sha-<commit> タグ等に
    # 差し替え可能。build: はローカル開発 / GHCR 障害時のフォールバック用に残置。
    image: ${APP_IMAGE_PROD:-ghcr.io/terai-takehiro/gmo-onair:prod}
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/onair_prod
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      CLIENT_URL: https://gmo-onair.jp
      ALLOWED_ORIGINS: https://gmo-onair.jp,https://www.gmo-onair.jp,https://interactive.gmo-onair.jp
      # v2 SSO: cookie を .gmo-onair.jp 全体で共有 (interactive.gmo-onair.jp と相互運用)
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.gmo-onair.jp}
      # SMS (Twilio)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@gmo-onair.jp}
      # 465 番（暗黙 TLS）を使うときは true。587 番（STARTTLS）は未設定でよい
      SMTP_SECURE: ${SMTP_SECURE:-}
      # BOX 連携 (v2.7.0+ / v2.7.10 で社内/社外フォルダ分離)
      BOX_CONFIG_JSON: ${BOX_CONFIG_JSON:-}
      BOX_PROJECT_PARENT_FOLDER_ID: ${BOX_PROJECT_PARENT_FOLDER_ID:-}
      BOX_PROJECT_PARENT_FOLDER_ID_INTERNAL: ${BOX_PROJECT_PARENT_FOLDER_ID_INTERNAL:-}
      # 取り込みの置き場所。未設定ならコード側の既定フォルダを見る
      XPOINT_BOX_FOLDER_ID: ${XPOINT_BOX_FOLDER_ID:-}
      KESSAN_BOX_FOLDER_ID: ${KESSAN_BOX_FOLDER_ID:-}
      # CoNoHa VPS スケーリング (v2.7.1+) — 未設定なら resize は 503 NOT_CONFIGURED
      CONOHA_API_USERNAME: ${CONOHA_API_USERNAME:-}
      CONOHA_API_PASSWORD: ${CONOHA_API_PASSWORD:-}
      CONOHA_TENANT_ID: ${CONOHA_TENANT_ID:-}
      CONOHA_SERVER_ID: ${CONOHA_SERVER_ID:-}
      CONOHA_IDENTITY_ENDPOINT: ${CONOHA_IDENTITY_ENDPOINT:-}
      CONOHA_COMPUTE_ENDPOINT: ${CONOHA_COMPUTE_ENDPOINT:-}
      # MCP サーバー (v2.9.171+) — 未設定なら /api/v1/mcp は 503 (機能無効)
      MCP_API_KEY: ${MCP_API_KEY:-}
      # タスク投入欄の解析 (v2.9.247+) — 未設定なら規則ベースに自動縮退 (投入口自体は動く)。
      # OpenAI / Anthropic のどちらでも可。両方あれば OpenAI が優先される。
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INTAKE_AI_PROVIDER: ${INTAKE_AI_PROVIDER:-}
      INTAKE_AI_MODEL: ${INTAKE_AI_MODEL:-}
      # ⚠️ **environment: は許可リストです。** ここに書かない変数は .env にあっても
      # コンテナに届きません（書いたのに効かない、という気づけない形になる）。
      # 増やしたら scripts/check-env-passthrough.mjs が照合します。
      # モデルの段（`server/src/shared/services/ai-model.ts`）。**機能をまたいで効く**
      AI_MODEL_HEAVY: ${AI_MODEL_HEAVY:-}
      AI_MODEL_LIGHT: ${AI_MODEL_LIGHT:-}
      # 機能ごとの名指し。**段より先に効く**（入れると長い入力でも上がらない）
      INTAKE_AI_MODEL_LIGHT: ${INTAKE_AI_MODEL_LIGHT:-}
      ACTIVITY_AI_MODEL: ${ACTIVITY_AI_MODEL:-}
      KPT_AI_MODEL: ${KPT_AI_MODEL:-}
      MINUTES_AI_MODEL: ${MINUTES_AI_MODEL:-}
      MINUTES_STT_MODEL: ${MINUTES_STT_MODEL:-}
      # 毎晩 3:00 のやり取り整形 (v4.0.1+)。off と書くと止まる
      ACTIVITY_FORMAT_NIGHTLY: ${ACTIVITY_FORMAT_NIGHTLY:-}
      NEXT_ACTION_SHORT_NIGHTLY: ${NEXT_ACTION_SHORT_NIGHTLY:-}
      # 案件の自動整理 (毎日 7:30。候補通知60日→自動見送り90日・受注→完了の繰り上げ)。AI は呼ばない。off で止まる
      PROJECT_TIDY_DAILY: ${PROJECT_TIDY_DAILY:-}
      # 制作資料 v4 段7: AI 提案の期限切れ(3:15)・締め(3:20)。AI は呼ばない。off で止まる
      QSHEET_AI_EXPIRE_NIGHTLY: ${QSHEET_AI_EXPIRE_NIGHTLY:-}
      QSHEET_AI_SETTLE_NIGHTLY: ${QSHEET_AI_SETTLE_NIGHTLY:-}
      # 制作資料 v4 段9: 月次 AI レビューの下書き(毎月1日 3:25)。AI は呼ばない。off で止まる
      QSHEET_AI_REVIEW_NIGHTLY: ${QSHEET_AI_REVIEW_NIGHTLY:-}
      # 月次レビューの担当者(1人)。未設定なら「未設定」として動く(通知は qsheet manager 全員へ届く)
      QSHEET_AI_REVIEW_OWNER_USER_ID: ${QSHEET_AI_REVIEW_OWNER_USER_ID:-}
      # AI の使用量を金額で出すための単価。**未設定ならトークン数と分数だけ出る**
      AI_PRICING_JSON: ${AI_PRICING_JSON:-}
      # Google カレンダー OAuth 連携 (v2.9.190+) — 未設定ならマイカレンダーの Google 連携は無効。
      # prod/dev で同じ OAuth クライアントを使う (Google Cloud に両ドメインの redirect URI を登録)。
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT: ${GOOGLE_OAUTH_REDIRECT:-}
      # Outlook (Microsoft 365) カレンダー OAuth 連携 (v2.9.191+) — 未設定なら無効。prod/dev で同じアプリ登録を共有。
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_OAUTH_REDIRECT: ${MS_OAUTH_REDIRECT:-}
      # 朝の1通 (Slack)。未設定なら機能ごと無効 (何も飛ばない)
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SKIP_SEED: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # v2.8.50: アップロードされた画像 (awards/qsheet) を Docker 再ビルドで失わないよう永続化
      - uploads_prod:/app/uploads
    restart: unless-stopped

  # ──────────────────────────────────────
  # 開発アプリ (dev.gmo-onair.jp)
  # ──────────────────────────────────────
  app_dev:
    # prod と同じく GHCR のビルド済みイメージを pull (タグは :dev)。
    # APP_IMAGE_DEV でロールバック用 sha-<commit> タグ等に差し替え可能。
    image: ${APP_IMAGE_DEV:-ghcr.io/terai-takehiro/gmo-onair:dev}
    build:
      context: /root/gmo-onair-dev
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/onair_dev
      NODE_ENV: development
      PORT: 3000
      # v4.1.8: rental_scraper_dev（下記サービス）が実クロール結果を qsheet_rental_items へ
      # 同期するようになったため、app_dev 自身のダミーサンプル投入（seed-rental.ts・8件）は
      # 止める。両方走らせると「見えている件数が実データかサンプルか」を画面から区別できなくなる
      SKIP_RENTAL_SEED: "true"
      # JWT_SECRET_DEV must be set in .env (no insecure fallback). Generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET_DEV:?JWT_SECRET_DEV is required (openssl rand -hex 32)}
      CLIENT_URL: https://dev.gmo-onair.jp
      ALLOWED_ORIGINS: https://dev.gmo-onair.jp,https://dev.interactive.gmo-onair.jp
      # v2 SSO: cookie を .gmo-onair.jp 全体で共有
      COOKIE_DOMAIN: ${COOKIE_DOMAIN_DEV:-.gmo-onair.jp}
      # v2.5.0: dev でも本番同様の email/password 認証を有効化
      AUTH_MODE: password
      # BOX 連携 (v2.7.0+ / v2.7.10) — dev/prod で同じ親フォルダを使ってもよいし別にしてもよい
      BOX_CONFIG_JSON: ${BOX_CONFIG_JSON_DEV:-${BOX_CONFIG_JSON:-}}
      BOX_PROJECT_PARENT_FOLDER_ID: ${BOX_PROJECT_PARENT_FOLDER_ID_DEV:-${BOX_PROJECT_PARENT_FOLDER_ID:-}}
      BOX_PROJECT_PARENT_FOLDER_ID_INTERNAL: ${BOX_PROJECT_PARENT_FOLDER_ID_INTERNAL_DEV:-${BOX_PROJECT_PARENT_FOLDER_ID_INTERNAL:-}}
      XPOINT_BOX_FOLDER_ID: ${XPOINT_BOX_FOLDER_ID_DEV:-${XPOINT_BOX_FOLDER_ID:-}}
      KESSAN_BOX_FOLDER_ID: ${KESSAN_BOX_FOLDER_ID_DEV:-${KESSAN_BOX_FOLDER_ID:-}}
      # CoNoHa VPS スケーリング (v2.7.1+) — dev も同じ VPS をリサイズするので prod と共有
      CONOHA_API_USERNAME: ${CONOHA_API_USERNAME:-}
      CONOHA_API_PASSWORD: ${CONOHA_API_PASSWORD:-}
      CONOHA_TENANT_ID: ${CONOHA_TENANT_ID:-}
      CONOHA_SERVER_ID: ${CONOHA_SERVER_ID:-}
      CONOHA_IDENTITY_ENDPOINT: ${CONOHA_IDENTITY_ENDPOINT:-}
      CONOHA_COMPUTE_ENDPOINT: ${CONOHA_COMPUTE_ENDPOINT:-}
      # MCP サーバー (v2.9.171+) — 未設定なら /api/v1/mcp は 503 (機能無効)。本番とは別のキーを使うこと
      MCP_API_KEY: ${MCP_API_KEY_DEV:-}
      # タスク投入欄の解析 (v2.9.247+) — dev 専用キーがあればそれを使う。未設定なら規則ベースに縮退
      OPENAI_API_KEY: ${OPENAI_API_KEY_DEV:-${OPENAI_API_KEY:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY_DEV:-${ANTHROPIC_API_KEY:-}}
      INTAKE_AI_PROVIDER: ${INTAKE_AI_PROVIDER_DEV:-${INTAKE_AI_PROVIDER:-}}
      INTAKE_AI_MODEL: ${INTAKE_AI_MODEL_DEV:-${INTAKE_AI_MODEL:-}}
      AI_MODEL_HEAVY: ${AI_MODEL_HEAVY_DEV:-${AI_MODEL_HEAVY:-}}
      AI_MODEL_LIGHT: ${AI_MODEL_LIGHT_DEV:-${AI_MODEL_LIGHT:-}}
      INTAKE_AI_MODEL_LIGHT: ${INTAKE_AI_MODEL_LIGHT:-}
      ACTIVITY_AI_MODEL: ${ACTIVITY_AI_MODEL:-}
      KPT_AI_MODEL: ${KPT_AI_MODEL:-}
      MINUTES_AI_MODEL: ${MINUTES_AI_MODEL:-}
      MINUTES_STT_MODEL: ${MINUTES_STT_MODEL:-}
      # **検証だけ止められるようにする。** 本番と検証は同じ鍵を共用できるので、
      # 両方が毎晩走ると同じ請求書に2つぶん載る
      ACTIVITY_FORMAT_NIGHTLY: ${ACTIVITY_FORMAT_NIGHTLY_DEV:-${ACTIVITY_FORMAT_NIGHTLY:-}}
      NEXT_ACTION_SHORT_NIGHTLY: ${NEXT_ACTION_SHORT_NIGHTLY_DEV:-${NEXT_ACTION_SHORT_NIGHTLY:-}}
      # 案件の自動整理。AI は呼ばないが、検証だけ止められるよう他の nightly と同じ形に揃える
      PROJECT_TIDY_DAILY: ${PROJECT_TIDY_DAILY_DEV:-${PROJECT_TIDY_DAILY:-}}
      # 制作資料 v4 段7。AI は呼ばないので費用の理由で分ける必要は無いが、他の nightly と同じ形に揃える
      QSHEET_AI_EXPIRE_NIGHTLY: ${QSHEET_AI_EXPIRE_NIGHTLY_DEV:-${QSHEET_AI_EXPIRE_NIGHTLY:-}}
      QSHEET_AI_SETTLE_NIGHTLY: ${QSHEET_AI_SETTLE_NIGHTLY_DEV:-${QSHEET_AI_SETTLE_NIGHTLY:-}}
      # 制作資料 v4 段9。同上（AI を呼ばない）
      QSHEET_AI_REVIEW_NIGHTLY: ${QSHEET_AI_REVIEW_NIGHTLY_DEV:-${QSHEET_AI_REVIEW_NIGHTLY:-}}
      # ⚠️ prod にフォールバックしない。検証は mockAuth の別ユーザー群なので、
      # 本番の利用者 id をそのまま渡しても存在しない id として無視されるだけで意味が無い
      QSHEET_AI_REVIEW_OWNER_USER_ID: ${QSHEET_AI_REVIEW_OWNER_USER_ID_DEV:-}
      # 単価は prod と共有する（値段は環境で変わらない。分けると必ず片方が古くなる）
      AI_PRICING_JSON: ${AI_PRICING_JSON:-}
      # Google カレンダー OAuth 連携 (v2.9.190+) — prod と同じ OAuth クライアントを共有 (redirect は CLIENT_URL から自動生成)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT: ${GOOGLE_OAUTH_REDIRECT_DEV:-}
      # Outlook (Microsoft 365) カレンダー OAuth 連携 (v2.9.191+) — prod と同じアプリ登録を共有 (redirect は CLIENT_URL から自動生成)
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_OAUTH_REDIRECT: ${MS_OAUTH_REDIRECT_DEV:-}
      # 検証は dev 用トークンを別に持てる (無ければ本番と同じものを使う)
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN_DEV:-${SLACK_BOT_TOKEN:-}}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # v2.8.50: アップロードされた画像 (awards/qsheet) を Docker 再ビルドで失わないよう永続化
      - uploads_dev:/app/uploads
    restart: unless-stopped

  # ──────────────────────────────────────
  # レンタル機材スクレイパー（検証環境・v4.1.8）
  # ──────────────────────────────────────
  # 東京オフラインセンター(TOC)・レスターの機材ページを毎日クロールし、
  # 検証の Postgres (onair_dev / qsheet_rental_items) へ同期する常駐コンテナ。
  # GHCR には積まない（rental-scraper/ を VPS 上でその場ビルドする軽量イメージ）。
  # 中身・運用手順は rental-scraper/README.md。デプロイの結線は
  # .github/workflows/deploy.yml の staging ジョブ（rental_scraper_dev）参照。
  #
  # 本番向けの同種サービスは下の rental_scraper_prod（v4.3.1〜。ユーザー指示により着手）。
  # 2つは対象サイトが同一（実サイトは検証・本番の区別をしない）なので、
  # 同時刻に走らせて2重にクロールしないよう時刻をずらしてある
  # （RENTAL_CRON_HOUR 既定5時 / rental_scraper_prod は RENTAL_CRON_HOUR_PROD 既定4時）。
  rental_scraper_dev:
    build:
      context: ./rental-scraper
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/onair_dev
      # デプロイ直後に1回実行する（「実際にスクレイピングできているか」を
      # 翌日5時を待たずに確認できるようにするため）。以降は RENTAL_CRON_HOUR に1日1回
      RENTAL_RUN_ON_STARTUP: "true"
      RENTAL_CRON_HOUR: ${RENTAL_CRON_HOUR:-5}
      # ステージング用 SQLite の置き場所。**必ず下の volume の中を指すこと。**
      # 既定値（カレントディレクトリ = /app）だとコンテナのファイルシステムに
      # 置かれるため、main へマージするたびの再作成で毎回まっさらに戻る。
      # 1回のクロールは数十分〜1時間超かかるので、マージが立て込む日は
      # 「途中まで取れた分」が毎回消えて永久に完走しない。
      RENTAL_SQLITE_PATH: /data/rental_items.db
    volumes:
      # クロール結果（ステージング）をコンテナ再作成をまたいで残す
      - rental_scraper_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────
  # レンタル機材スクレイパー（本番環境・v4.3.1）
  # ──────────────────────────────────────
  # 中身は rental_scraper_dev と同一イメージ（rental-scraper/）。同期先の
  # Postgres だけ本番 (onair_prod) に向けてある。GHCR には積まず VPS 上でその場ビルド。
  # デプロイの結線は .github/workflows/deploy.yml の production ジョブ参照。
  #
  # ⚠️ 本番デプロイは Release 公開時のみ（main マージのたびに動く検証と違い頻度が低い）
  # ため、デプロイのたびに再実行される検証と同じ「毎回起動時に1回クロール」でも
  # 対象サイトへの負荷が跳ね上がる心配はない。
  rental_scraper_prod:
    build:
      context: ./rental-scraper
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/onair_prod
      # デプロイ直後に1回実行する（本番へ出した直後に「実際にスクレイピングできているか」を
      # 翌日の実行時刻を待たずに確認できるようにするため。rental_scraper_dev と同じ理由）
      RENTAL_RUN_ON_STARTUP: "true"
      # 検証 (rental_scraper_dev の既定5時) とわざとずらす。対象サイトは検証・本番で
      # 同一の実サイトなので、同時刻に両方から叩くと実質クロール頻度が2倍になる
      RENTAL_CRON_HOUR: ${RENTAL_CRON_HOUR_PROD:-4}
      # ステージング用 SQLite の置き場所。rental_scraper_dev と同じ理由で
      # 必ず下の volume の中（コンテナ再作成をまたいで途中経過を残す）
      RENTAL_SQLITE_PATH: /data/rental_items.db
    volumes:
      - rental_scraper_prod_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────
  # Nginx (SSL + リバースプロキシ)
  # ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gmo-onair.conf:/etc/nginx/conf.d/default.conf:ro
      # v2.5.0: dev-htpasswd マウント撤去 (Basic 認証廃止)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app_prod
      - app_dev
    restart: unless-stopped

volumes:
  pgdata:
  uploads_prod:
  uploads_dev:
  # レンタル機材スクレイパーのステージング SQLite (rental_items.db)。
  # コンテナはデプロイのたびに作り直されるので、ここに逃がさないと
  # 未完のクロール結果が毎回消える (rental_scraper_dev の RENTAL_SQLITE_PATH)
  rental_scraper_data:
  # 同上（本番用・rental_scraper_prod の RENTAL_SQLITE_PATH）。dev とボリュームを
  # 共有すると本番・検証のステージングデータが混ざるので必ず別にする
  rental_scraper_prod_data:
