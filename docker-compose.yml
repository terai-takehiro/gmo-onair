# =============================================
# GMO ONAiR — 本番 + 開発 2環境構成
# gmo-onair.jp (本番) / dev.gmo-onair.jp (開発)
# =============================================

services:
  # ──────────────────────────────────────
  # PostgreSQL (共有インスタンス、DB名で分離)
  # ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # 新規クラスタ初期化時に UTF-8 を強制（既存クラスタには影響しない）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      LANG: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────
  # 本番アプリ (gmo-onair.jp)
  # ──────────────────────────────────────
  app_prod:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/onair_prod
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: https://gmo-onair.jp
      ALLOWED_ORIGINS: https://gmo-onair.jp,https://www.gmo-onair.jp
      ICAL_FEED_TOKEN: ${ICAL_FEED_TOKEN:-}
      # SMS (Twilio)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@gmo-onair.jp}
      # BOX 連携 (v2.7.0+) — 未設定なら BOX 連携無効
      BOX_CONFIG_JSON: ${BOX_CONFIG_JSON:-}
      BOX_PROJECT_PARENT_FOLDER_ID: ${BOX_PROJECT_PARENT_FOLDER_ID:-}
      # CoNoHa VPS スケーリング (v2.7.1+) — 未設定なら resize は 503 NOT_CONFIGURED
      CONOHA_API_USERNAME: ${CONOHA_API_USERNAME:-}
      CONOHA_API_PASSWORD: ${CONOHA_API_PASSWORD:-}
      CONOHA_TENANT_ID: ${CONOHA_TENANT_ID:-}
      CONOHA_SERVER_ID: ${CONOHA_SERVER_ID:-}
      CONOHA_IDENTITY_ENDPOINT: ${CONOHA_IDENTITY_ENDPOINT:-}
      CONOHA_COMPUTE_ENDPOINT: ${CONOHA_COMPUTE_ENDPOINT:-}
      SKIP_SEED: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────
  # 開発アプリ (dev.gmo-onair.jp)
  # ──────────────────────────────────────
  app_dev:
    build:
      context: /root/gmo-onair-dev
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/onair_dev
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET_DEV:-dev-jwt-secret-do-not-use-in-production}
      CLIENT_URL: https://dev.gmo-onair.jp
      ALLOWED_ORIGINS: https://dev.gmo-onair.jp
      # v2.5.0: dev でも本番同様の email/password 認証を有効化
      AUTH_MODE: password
      # BOX 連携 (v2.7.0+) — dev/prod で同じ親フォルダを使ってもよいし別にしてもよい
      BOX_CONFIG_JSON: ${BOX_CONFIG_JSON_DEV:-${BOX_CONFIG_JSON:-}}
      BOX_PROJECT_PARENT_FOLDER_ID: ${BOX_PROJECT_PARENT_FOLDER_ID_DEV:-${BOX_PROJECT_PARENT_FOLDER_ID:-}}
      # CoNoHa VPS スケーリング (v2.7.1+) — dev も同じ VPS をリサイズするので prod と共有
      CONOHA_API_USERNAME: ${CONOHA_API_USERNAME:-}
      CONOHA_API_PASSWORD: ${CONOHA_API_PASSWORD:-}
      CONOHA_TENANT_ID: ${CONOHA_TENANT_ID:-}
      CONOHA_SERVER_ID: ${CONOHA_SERVER_ID:-}
      CONOHA_IDENTITY_ENDPOINT: ${CONOHA_IDENTITY_ENDPOINT:-}
      CONOHA_COMPUTE_ENDPOINT: ${CONOHA_COMPUTE_ENDPOINT:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────
  # Nginx (SSL + リバースプロキシ)
  # ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gmo-onair.conf:/etc/nginx/conf.d/default.conf:ro
      # v2.5.0: dev-htpasswd マウント撤去 (Basic 認証廃止)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app_prod
      - app_dev
    restart: unless-stopped

volumes:
  pgdata:
