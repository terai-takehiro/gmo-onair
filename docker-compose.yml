# =============================================
# GMO ONAiR — 本番 + 開発 2環境構成
# gmo-onair.jp (本番) / dev.gmo-onair.jp (開発)
# =============================================

services:
  # ──────────────────────────────────────
  # PostgreSQL (共有インスタンス、DB名で分離)
  # ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # 新規クラスタ初期化時に UTF-8 を強制（既存クラスタには影響しない）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      LANG: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────
  # 本番アプリ (gmo-onair.jp)
  # ──────────────────────────────────────
  app_prod:
    # デプロイは GitHub Actions がビルドして GHCR に push したイメージを pull して使う
    # (deploy.yml 参照)。APP_IMAGE_PROD を指定すればロールバック用の sha-<commit> タグ等に
    # 差し替え可能。build: はローカル開発 / GHCR 障害時のフォールバック用に残置。
    image: ${APP_IMAGE_PROD:-ghcr.io/terai-takehiro/gmo-onair:prod}
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/onair_prod
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      CLIENT_URL: https://gmo-onair.jp
      ALLOWED_ORIGINS: https://gmo-onair.jp,https://www.gmo-onair.jp,https://interactive.gmo-onair.jp
      # v2 SSO: cookie を .gmo-onair.jp 全体で共有 (interactive.gmo-onair.jp と相互運用)
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.gmo-onair.jp}
      # SMS (Twilio)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@gmo-onair.jp}
      # BOX 連携 (v2.7.0+ / v2.7.10 で社内/社外フォルダ分離)
      BOX_CONFIG_JSON: ${BOX_CONFIG_JSON:-}
      BOX_PROJECT_PARENT_FOLDER_ID: ${BOX_PROJECT_PARENT_FOLDER_ID:-}
      BOX_PROJECT_PARENT_FOLDER_ID_INTERNAL: ${BOX_PROJECT_PARENT_FOLDER_ID_INTERNAL:-}
      # CoNoHa VPS スケーリング (v2.7.1+) — 未設定なら resize は 503 NOT_CONFIGURED
      CONOHA_API_USERNAME: ${CONOHA_API_USERNAME:-}
      CONOHA_API_PASSWORD: ${CONOHA_API_PASSWORD:-}
      CONOHA_TENANT_ID: ${CONOHA_TENANT_ID:-}
      CONOHA_SERVER_ID: ${CONOHA_SERVER_ID:-}
      CONOHA_IDENTITY_ENDPOINT: ${CONOHA_IDENTITY_ENDPOINT:-}
      CONOHA_COMPUTE_ENDPOINT: ${CONOHA_COMPUTE_ENDPOINT:-}
      # MCP サーバー (v2.9.171+) — 未設定なら /api/v1/mcp は 503 (機能無効)
      MCP_API_KEY: ${MCP_API_KEY:-}
      # タスク投入欄の解析 (v2.9.247+) — 未設定なら規則ベースに自動縮退 (投入口自体は動く)。
      # OpenAI / Anthropic のどちらでも可。両方あれば OpenAI が優先される。
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INTAKE_AI_PROVIDER: ${INTAKE_AI_PROVIDER:-}
      INTAKE_AI_MODEL: ${INTAKE_AI_MODEL:-}
      # Google カレンダー OAuth 連携 (v2.9.190+) — 未設定ならマイカレンダーの Google 連携は無効。
      # prod/dev で同じ OAuth クライアントを使う (Google Cloud に両ドメインの redirect URI を登録)。
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT: ${GOOGLE_OAUTH_REDIRECT:-}
      # Outlook (Microsoft 365) カレンダー OAuth 連携 (v2.9.191+) — 未設定なら無効。prod/dev で同じアプリ登録を共有。
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_OAUTH_REDIRECT: ${MS_OAUTH_REDIRECT:-}
      # 朝の1通 (Slack)。未設定なら機能ごと無効 (何も飛ばない)
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SKIP_SEED: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # v2.8.50: アップロードされた画像 (awards/qsheet) を Docker 再ビルドで失わないよう永続化
      - uploads_prod:/app/uploads
    restart: unless-stopped

  # ──────────────────────────────────────
  # 開発アプリ (dev.gmo-onair.jp)
  # ──────────────────────────────────────
  app_dev:
    # prod と同じく GHCR のビルド済みイメージを pull (タグは :dev)。
    # APP_IMAGE_DEV でロールバック用 sha-<commit> タグ等に差し替え可能。
    image: ${APP_IMAGE_DEV:-ghcr.io/terai-takehiro/gmo-onair:dev}
    build:
      context: /root/gmo-onair-dev
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/onair_dev
      NODE_ENV: development
      PORT: 3000
      # JWT_SECRET_DEV must be set in .env (no insecure fallback). Generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET_DEV:?JWT_SECRET_DEV is required (openssl rand -hex 32)}
      CLIENT_URL: https://dev.gmo-onair.jp
      ALLOWED_ORIGINS: https://dev.gmo-onair.jp,https://dev.interactive.gmo-onair.jp
      # v2 SSO: cookie を .gmo-onair.jp 全体で共有
      COOKIE_DOMAIN: ${COOKIE_DOMAIN_DEV:-.gmo-onair.jp}
      # v2.5.0: dev でも本番同様の email/password 認証を有効化
      AUTH_MODE: password
      # BOX 連携 (v2.7.0+ / v2.7.10) — dev/prod で同じ親フォルダを使ってもよいし別にしてもよい
      BOX_CONFIG_JSON: ${BOX_CONFIG_JSON_DEV:-${BOX_CONFIG_JSON:-}}
      BOX_PROJECT_PARENT_FOLDER_ID: ${BOX_PROJECT_PARENT_FOLDER_ID_DEV:-${BOX_PROJECT_PARENT_FOLDER_ID:-}}
      BOX_PROJECT_PARENT_FOLDER_ID_INTERNAL: ${BOX_PROJECT_PARENT_FOLDER_ID_INTERNAL_DEV:-${BOX_PROJECT_PARENT_FOLDER_ID_INTERNAL:-}}
      # CoNoHa VPS スケーリング (v2.7.1+) — dev も同じ VPS をリサイズするので prod と共有
      CONOHA_API_USERNAME: ${CONOHA_API_USERNAME:-}
      CONOHA_API_PASSWORD: ${CONOHA_API_PASSWORD:-}
      CONOHA_TENANT_ID: ${CONOHA_TENANT_ID:-}
      CONOHA_SERVER_ID: ${CONOHA_SERVER_ID:-}
      CONOHA_IDENTITY_ENDPOINT: ${CONOHA_IDENTITY_ENDPOINT:-}
      CONOHA_COMPUTE_ENDPOINT: ${CONOHA_COMPUTE_ENDPOINT:-}
      # MCP サーバー (v2.9.171+) — 未設定なら /api/v1/mcp は 503 (機能無効)。本番とは別のキーを使うこと
      MCP_API_KEY: ${MCP_API_KEY_DEV:-}
      # タスク投入欄の解析 (v2.9.247+) — dev 専用キーがあればそれを使う。未設定なら規則ベースに縮退
      OPENAI_API_KEY: ${OPENAI_API_KEY_DEV:-${OPENAI_API_KEY:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY_DEV:-${ANTHROPIC_API_KEY:-}}
      INTAKE_AI_PROVIDER: ${INTAKE_AI_PROVIDER_DEV:-${INTAKE_AI_PROVIDER:-}}
      INTAKE_AI_MODEL: ${INTAKE_AI_MODEL_DEV:-${INTAKE_AI_MODEL:-}}
      # Google カレンダー OAuth 連携 (v2.9.190+) — prod と同じ OAuth クライアントを共有 (redirect は CLIENT_URL から自動生成)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT: ${GOOGLE_OAUTH_REDIRECT_DEV:-}
      # Outlook (Microsoft 365) カレンダー OAuth 連携 (v2.9.191+) — prod と同じアプリ登録を共有 (redirect は CLIENT_URL から自動生成)
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_OAUTH_REDIRECT: ${MS_OAUTH_REDIRECT_DEV:-}
      # 検証は dev 用トークンを別に持てる (無ければ本番と同じものを使う)
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN_DEV:-${SLACK_BOT_TOKEN:-}}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # v2.8.50: アップロードされた画像 (awards/qsheet) を Docker 再ビルドで失わないよう永続化
      - uploads_dev:/app/uploads
    restart: unless-stopped

  # ──────────────────────────────────────
  # Nginx (SSL + リバースプロキシ)
  # ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gmo-onair.conf:/etc/nginx/conf.d/default.conf:ro
      # v2.5.0: dev-htpasswd マウント撤去 (Basic 認証廃止)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app_prod
      - app_dev
    restart: unless-stopped

volumes:
  pgdata:
  uploads_prod:
  uploads_dev:
